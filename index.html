<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e8ec; --muted:#8b93a7; --accent:#6366f1; --accent2:#818cf8;
    --danger:#ef4444; --ok:#10b981; --warn:#f59e0b;
    --r:12px; --rs:8px;

  *{box-sizing:border-box}
   html,body{margin:0;height:100%;color-scheme:dark}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{
    font:inherit;color:var(--text);background:var(--panel2);
    border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px;width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
    select option,
  select optgroup{
    background-color:#1e222b;
    color:#e6e8ec;
  }
  select option:checked,
  select option:hover{
    background-color:#6366f1;
    color:#ffffff;
  }
  textarea{resize:vertical;min-height:80px}
  input[type=checkbox]{width:auto;flex-shrink:0;accent-color:var(--accent)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}

  #root{min-height:100vh;display:flex;flex-direction:column}
  .shell{display:flex;flex:1;min-height:100vh}
  .sidebar{

    display:flex;flex-direction:column;flex-shrink:0;

  .brand{padding:18px 18px 14px;font-weight:700;font-size:18px;letter-spacing:.2px;

  .nav{padding:6px 8px;display:flex;flex-direction:column;gap:2px}

  .nav-item.active{background:var(--panel2);color:var(--text)}
  .nav-sep{padding:14px 18px 6px;font-size:11px;text-transform:uppercase;

    color:var(--muted);font-weight:500;

  .group-item.active{background:var(--panel2);color:var(--text)}
  .group-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .sw-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0}
  .sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}

  .cp-prev span{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);letter-spacing:1px}

  .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;

  .user-meta .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:none;padding:12px 16px;border-bottom:1px solid var(--border);

  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
  h2{font-size:18px;margin:28px 0 12px;letter-spacing:-.2px}
  h3{font-size:15px;margin:0 0 8px}
  .sub{color:var(--muted);font-size:13px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rs);
    background:var(--panel2);border:1px solid var(--border);font-weight:500;font-size:14px;
  }
  .btn:hover{border-color:#3a4150}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 10px;font-size:13px}
  .btn.danger{color:var(--danger)}

  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r);

  .row.between{justify-content:space-between}
  .grid{display:grid;gap:12px}

  .li .meta{font-size:12px;color:var(--muted);margin-top:2px}

  /* ============ SPLASH D'OUVERTURE ============ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse at center, #141826 0%, #07080f 75%);
  display:grid;place-items:center;overflow:hidden;
  animation:splashOut 1s ease-in 4.2s forwards;
  pointer-events:none;
}
#splash.hide{display:none}

.note-wrap{
  position:relative;
  width:180px;height:250px;
  animation:noteGrow 1.45s cubic-bezier(.25,.9,.3,1.15) forwards;
}
.note-wrap .note-svg{
  width:100%;height:100%;
  filter:
    drop-shadow(0 0 22px #4f46e5)
    drop-shadow(0 0 55px #6366f1)
    drop-shadow(0 0 110px rgba(99,102,241,.55));
}
.note-wrap.boom{
  animation:noteBoom .55s cubic-bezier(.5,.05,.6,1) forwards;
}
.note-wrap.soft{animation:noteSoft .9s ease-out forwards}
@keyframes noteSoft{
  0%{transform:scale(1.22);opacity:1}
  100%{transform:scale(1.22);opacity:.25}
}

.instrument{
  position:absolute;top:50%;left:50%;
  font-size:44px;line-height:1;
  opacity:0;
  transform:translate(-50%,-50%) scale(.25);
  animation:fly 2.2s cubic-bezier(.15,.6,.4,1) forwards;
  filter:drop-shadow(0 6px 16px currentColor) drop-shadow(0 0 30px currentColor);
  pointer-events:none;
}

@keyframes noteGrow{
  0%   {transform:scale(.12) rotate(-20deg);opacity:0}
  25%  {transform:scale(.55) rotate(-8deg);opacity:1}
  55%  {transform:scale(.95) rotate(2deg);opacity:1}
  80%  {transform:scale(1.12) rotate(0deg)}
  100% {transform:scale(1.22) rotate(0deg);opacity:1}
}
@keyframes noteBoom{
  0%   {transform:scale(1.22);opacity:1;filter:brightness(1)}
  40%  {transform:scale(1.75);opacity:.85;filter:brightness(2.2)}
  100% {transform:scale(2.8);opacity:0;filter:brightness(3)}
}
@keyframes fly{
  0%   {opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(0deg)}
  12%  {opacity:1}
  55%  {opacity:1}
  100% {opacity:0;
        transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.15) rotate(var(--r,0deg))}
}
@keyframes splashOut{
  to{opacity:0;visibility:hidden}

}
</style>

function normalize(){
  const toArr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.values(x) : []);
  const toObj = x => (x && typeof x === 'object' && !Array.isArray(x)) ? x : {};

  (data.events || []).forEach(e=>{
    e.setlist = toArr(e.setlist);
    e.availability = toObj(e.availability);
    e.checklist = toArr(e.checklist).map(c=>typeof c==='string'?{t:c,done:false}:c);
    e.journal = toArr(e.journal);
  });
  (data.groups || []).forEach(g=>{
    g.memberships = toArr(g.memberships).map(m=>({instrument:'', ...m}));
    g.locations = toArr(g.locations);
  });
  (data.tasks || []).forEach(t=>{
    t.assignedTo = toArr(t.assignedTo).filter(Boolean);
  });
  (data.songs || []).forEach(s=>{
    s.parts = toObj(s.parts);
  });
  (data.reviews || []).forEach(r=>{
    r.songs = toArr(r.songs);
  });

  if(!Array.isArray(data.eventTypes) || !data.eventTypes.length){
    data.eventTypes = [
      {id:'repetition', label:'Répétition', icon:'🎸'},
      {id:'concert',    label:'Concert',    icon:'🎤'},
      {id:'studio',     label:'Studio',     icon:'🎛️'},
      {id:'autre',      label:'Autre',      icon:'📌'},
    ];
  }
}
function stripPins(){ let ch=false; data.users.forEach(u=>{ if('pin' in u){ delete u.pin; ch=true; } }); return ch; }
function dedupeUsers(){
  const nkey = n => String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
  const seenId = {}, byName = {}, map = {}, out = [];
  let changed = false;
  data.users.forEach(u=>{
    if(seenId[u.id]){ changed = true; return; }
    seenId[u.id] = true;
    const k = nkey(u.name) || u.id;
    if(byName[k]){
      map[u.id] = byName[k].id; changed = true;
      if(!byName[k].instruments && u.instruments) byName[k].instruments = u.instruments;
    } else { byName[k] = u; out.push(u); }
  });
  const re = id => map[id] || id;
  data.users = out;
  data.groups.forEach(g=>{
    const seen = {}, ms = [];
    (g.memberships||[]).forEach(m=>{
      const id = re(m.userId);
      if(seen[id]){
        changed = true;
        if(m.role==='admin') seen[id].role = 'admin';
        if(!seen[id].instrument && m.instrument) seen[id].instrument = m.instrument;
      } else { const nm = {...m, userId:id}; seen[id] = nm; ms.push(nm); }
    });
    g.memberships = ms;
  });
  if(!Object.keys(map).length) return changed;
  data.tasks.forEach(t=>{
    if(Array.isArray(t.assignedTo)) t.assignedTo = [...new Set(t.assignedTo.map(re))];
  });
  data.events.forEach(e=>{
    const av = e.availability || {};
    for(const old in map){
      if(old in av){ if(!av[map[old]]) av[map[old]] = av[old]; delete av[old]; }
    }
  });
  data.comments.forEach(c=>{ c.userId = re(c.userId); });
  data.songs.forEach(s=>{ if(s.createdBy) s.createdBy = re(s.createdBy); });
  data.songVersions.forEach(v=>{ if(v.createdBy) v.createdBy = re(v.createdBy); });
  Object.keys(data.privateNotes||{}).forEach(k=>{
    const [u,...rest] = k.split(':');
    if(map[u]){
      const nk = map[u]+':'+rest.join(':');
      if(!(nk in data.privateNotes)) data.privateNotes[nk] = data.privateNotes[k];
      delete data.privateNotes[k];
    }
  });
  if(typeof ui!=='undefined' && ui.currentUserId && map[ui.currentUserId]){
    ui.currentUserId = map[ui.currentUserId]; localStorage.setItem(ME_KEY, ui.currentUserId);
  }
  return true;
}

async function syncTick(){
  if(!sync||busy) return;
  if(fbAuth && fbUser===undefined){ setTimeout(syncTick,300); return; }
  if(fbAuth && !fbUser) return;
  busy=true; setStatus('sync');
  const T = await tok();
  try{
    if(dirty){
      const v=ver, cur=snap(data), upd={};
      COLS.forEach(c=>{
        for(const id in cur[c]) if((last[c]||{})[id]!==cur[c][id]) upd[c+'/'+id]=JSON.parse(cur[c][id]);
        for(const id in (last[c]||{})) if(!(id in cur[c])) upd[c+'/'+id]=null;
      });
      if(Object.keys(upd).length){
        const r=await fetch(withAuth(syncBase()+'.json',T),{method:'PATCH',body:JSON.stringify(upd)});
        if(!r.ok) throw new Error('push');
      }
      last=cur; if(ver===v) dirty=false;
    } else {
      const r=await fetch(withAuth(syncBase()+'.json',T)); if(!r.ok) throw new Error('pull');
      const rem=await r.json();
      if(rem===null){ last={}; dirty=true; setTimeout(syncTick,150); }
      else {
        const before=JSON.stringify(COLS.map(c=>data[c]));
        COLS.forEach(c=>{ data[c]=Object.values(rem[c]||{}); });
               normalize(); last=snap(data);
        if(dedupeUsers()){ dirty=true; ver++; setTimeout(syncTick,150); }
        if(stripPins()){ dirty=true; ver++; setTimeout(syncTick,150); }
        localStorage.setItem(KEY, JSON.stringify(data));
        if(ui.currentUserId && !user(ui.currentUserId)) ui.currentUserId=null;
               if(!ui.currentUserId) applyPending();
        if(ready && (JSON.stringify(COLS.map(c=>data[c]))!==before || pendingRender)){
          if(idle()){ render(); pendingRender=false; } else pendingRender=true;
        }
      }
    }
    setStatus('ok');
    if(isRoomAdmin() && ui.view==='musicians') refreshJoined();
  }catch(e){
    window.syncErr = String((e&&e.message)||e);
    if(!ready) last=snap(data);
    setStatus('off');
  }finally{
    busy=false;
    if(!ready){ ready=true; render(); }
  }
}

function fmtRelative(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const a = new Date(d.getFullYear(),d.getMonth(),d.getDate()), b = new Date(); b.setHours(0,0,0,0);
  const diff = Math.round((a - b)/86400000);
  if(diff === 0) return "aujourd'hui";
  if(diff === 1) return 'demain';
  if(diff === -1) return 'hier';
  if(diff > 1 && diff < 7) return `dans ${diff} jours`;
  if(diff < -1 && diff > -7) return `il y a ${-diff} jours`;
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

/* ============ ACCÈS : INVITATION (QR / CODE) + RECONNEXION GOOGLE ============ */
const DB_URL = FIREBASE_CONFIG.databaseURL.replace(/\/+$/,'');
const INVITE_DAYS = 365;
const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const ADMIN_KEY = 'pupitre-admin', INVITE_KEY = 'pupitre-invite-pending';
let myMember = null;          // accès de cet appareil : {userId, admin}
let identityPending = false;  // vrai pendant la vérification de l'accès
let claiming = false;         // vrai pendant l'utilisation d'une invitation (évite une course avec l'écouteur de connexion)
let joined = {};              // userId -> true (liste des musiciens déjà connectés, vue par l'admin)

function isRoomAdmin(){ return !!(myMember && myMember.admin); }
async function tok(){
  try{ const u = fbAuth && fbAuth.currentUser; return u ? await u.getIdToken() : null; }catch(e){ return null; }
}
function withAuth(url, t){ return t ? url + (url.indexOf('?')>=0 ? '&' : '?') + 'auth=' + encodeURIComponent(t) : url; }
async function dbCall(method, path, body){
  const t = await tok();
  return fetch(withAuth(DB_URL + '/' + path + '.json', t), {method, body: body===undefined ? undefined : JSON.stringify(body)});
}
function genCode(){
  const a = new Uint32Array(8); crypto.getRandomValues(a);
  return Array.from(a, n => CODE_ALPHABET[n % CODE_ALPHABET.length]).join('');
}
const normCode = v => String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const showCode = c => c.slice(0,4) + '-' + c.slice(4);
function isIOSTab(){
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  return ios && !navigator.standalone;
}
function authErrMsg(e){
  const c = (e && e.code) || '';
  if(c.includes('operation-not-allowed') || c.includes('admin-restricted')) return "Cette méthode de connexion n'est pas activée dans Firebase (Authentication → Méthode de connexion).";
  if(c.includes('unauthorized-domain')) return "L'adresse de l'appli n'est pas autorisée dans Firebase (Authentication → Paramètres → Domaines autorisés).";
  if(c.includes('network')) return 'Pas de connexion internet.';
  if(c.includes('popup-closed') || c.includes('cancelled')) return '';
  if(c.includes('popup-blocked') || c.includes('not-supported')) return "La fenêtre Google ne s'est pas ouverte. Utilise ton code d'invitation.";
  return 'Erreur : ' + ((e && e.message) || e);
}
async function ensureSignedIn(){
  if(!fbAuth) throw new Error('Firebase Auth non disponible (connexion internet nécessaire).');
  if(fbAuth.currentUser) return fbAuth.currentUser;
  const c = await fbAuth.signInAnonymously();
  return c.user;
}
function storeAccess(room, userId, admin){
  localStorage.setItem(SYNC_KEY, JSON.stringify({room, db:DB_URL}));
  localStorage.setItem(ME_KEY, userId);
  if(admin === true) localStorage.setItem(ADMIN_KEY, '1');
  else if(admin === false) localStorage.removeItem(ADMIN_KEY);   // indéfini : on ne touche pas (recalculé au prochain démarrage)
}
async function claimInvite(raw){
  claiming = true;
  const r = await claimInvite_(raw);
  if(!r.ok){ claiming = false; identityPending = false; }
  return r;
}
async function claimInvite_(raw){
  const code = normCode(raw);
  if(code.length !== 8) return {err:'Le code comporte 8 caractères.'};
  let u; try{ u = await ensureSignedIn(); }catch(e){ return {err: authErrMsg(e) || 'Connexion impossible.'}; }
  const t = await u.getIdToken();
  let r;
  try{ r = await fetch(withAuth(DB_URL + '/invites/' + code + '.json', t)); }
  catch(e){ return {err:'Pas de connexion internet.'}; }
  if(!r.ok) return {err:'Accès à la base refusé (' + r.status + ').'};
  const inv = await r.json();
  if(!inv || !inv.room || !inv.userId) return {err:'Code inconnu ou déjà utilisé. Demande-en un nouveau à Jacques.'};
  if(inv.exp && inv.exp < Date.now()) return {err:'Ce code a expiré. Demande-en un nouveau à Jacques.'};
  r = await fetch(withAuth(DB_URL + '/members/' + encodeURIComponent(inv.room) + '/' + u.uid + '.json', t),
    {method:'PUT', body:JSON.stringify(Object.assign({userId:inv.userId, code, via:'invite', at:Date.now()}, inv.admin ? {admin:true} : {}))});
  if(!r.ok) return {err:'Invitation refusée (' + r.status + ').'};
  await fetch(withAuth(DB_URL + '/userRooms/' + u.uid + '.json', t), {method:'PUT', body:JSON.stringify({room:inv.room, userId:inv.userId})}).catch(()=>{});
  storeAccess(inv.room, inv.userId, !!inv.admin);
  return {ok:true};
}
async function bootstrapAdmin(userId, roomCode){
  claiming = true;
  const r = await bootstrapAdmin_(userId, roomCode);
  if(!r.ok){ claiming = false; identityPending = false; }
  return r;
}
async function bootstrapAdmin_(userId, roomCode){
  let u; try{ u = await ensureSignedIn(); }catch(e){ return {err: authErrMsg(e) || 'Connexion impossible.'}; }
  const room = (sync && sync.room) || String(roomCode||'').trim();
  if(!room) return {err:'Indique le code du groupe (menu Synchro).'};
  const t = await u.getIdToken();
  let r;
  try{
    r = await fetch(withAuth(DB_URL + '/members/' + encodeURIComponent(room) + '/' + u.uid + '.json', t),
      {method:'PUT', body:JSON.stringify({userId, admin:true, bootstrap:true, via:'bootstrap', at:Date.now()})});
  }catch(e){ return {err:'Pas de connexion internet.'}; }
  if(!r.ok) return {err: (r.status===401 || r.status===403) ? "Un administrateur existe déjà. Utilise ton code d'invitation." : 'Erreur ' + r.status};
  await fetch(withAuth(DB_URL + '/userRooms/' + u.uid + '.json', t), {method:'PUT', body:JSON.stringify({room, userId})}).catch(()=>{});
  storeAccess(room, userId, true);
  return {ok:true};
}
async function resolveIdentity(){
  const u = fbAuth && fbAuth.currentUser; if(!u) return null;
  const cachedMe = localStorage.getItem(ME_KEY);
  try{
    const room = sync && sync.room;
    if(!room){
      const r0 = await dbCall('GET', 'userRooms/' + u.uid);
      if(r0.ok){
        const v0 = await r0.json();
        if(v0 && v0.room && v0.userId){ storeAccess(v0.room, v0.userId); return 'reload'; }
      }
      return null;
    }
    const r = await dbCall('GET', 'members/' + encodeURIComponent(room) + '/' + u.uid);
    if(!r.ok) return null;
    const v = await r.json();
    if(v && v.userId){
      if(v.admin) localStorage.setItem(ADMIN_KEY, '1'); else localStorage.removeItem(ADMIN_KEY);
      return {userId:v.userId, admin:!!v.admin};
    }
    return null;
  }catch(e){
    // hors ligne : on garde l'accès déjà connu sur cet appareil
    if(cachedMe && sync && sync.room) return {userId:cachedMe, admin: localStorage.getItem(ADMIN_KEY)==='1'};
    return null;
  }
}
async function autoClaimPending(){
  const pend = localStorage.getItem(INVITE_KEY); if(!pend) return false;
  localStorage.removeItem(INVITE_KEY);
  if(isIOSTab()){ ui.iosInvite = pend; return false; }
  const res = await claimInvite(pend);
  if(res.ok){ location.reload(); return true; }
  ui.loginMsg = res.err;
  return false;
}
async function createInvite(userId){
  const code = genCode();
  const admin = !!(myMember && myMember.userId === userId);
  const body = {room: sync.room, userId, exp: Date.now() + INVITE_DAYS*86400000, created: Date.now()};
  if(admin) body.admin = true;
  const r = await dbCall('PUT', 'invites/' + code, body);
  if(!r.ok) throw new Error('statut ' + r.status);
  return {code, admin};
}
async function refreshJoined(){
  if(!sync || !isRoomAdmin()) return;
  try{
    const r = await dbCall('GET', 'members/' + encodeURIComponent(sync.room));
    if(!r.ok) return;
    const v = (await r.json()) || {};
    const j = {};
    Object.keys(v).forEach(k => { if(v[k] && v[k].userId) j[v[k].userId] = true; });
    if(JSON.stringify(j) !== JSON.stringify(joined)){ joined = j; if(ui.view==='musicians' && idle()) render(); }
  }catch(e){}
}
async function revokeAccess(userId, silent){
  const u = user(userId);
  if(!silent && !confirm("Retirer l'accès de « " + (u ? u.name : userId) + " » ?\n\nIl devra être réinvité pour revenir.")) return;
  try{
    const room = encodeURIComponent(sync.room);
    const r = await dbCall('GET', 'members/' + room);
    const v = (r.ok && await r.json()) || {};
    const keys = Object.keys(v).filter(k => v[k] && v[k].userId===userId && !v[k].admin);
    await Promise.all(keys.map(k => dbCall('DELETE', 'members/' + room + '/' + k)));
    if(!silent){ alert(keys.length ? 'Accès retiré.' : 'Aucun appareil à retirer.'); refreshJoined(); }
  }catch(e){ if(!silent) alert('Impossible : ' + ((e && e.message) || e)); }
}
async function linkGoogle(){
  const u = fbAuth && fbAuth.currentUser;
  if(!u){ alert("Tu n'es pas connecté."); return; }
  if((u.providerData||[]).some(p => p.providerId==='google.com')){ alert('Ton compte Google est déjà lié.'); return; }
  try{
    await u.linkWithPopup(new firebase.auth.GoogleAuthProvider());
    alert("Compte Google lié. Sur un nouvel appareil, touche « Se reconnecter avec Google » : pas besoin de nouvelle invitation.");
  }catch(e){
    const c = (e && e.code) || '';
    if(c.includes('credential-already-in-use') || c.includes('email-already-in-use')) alert('Ce compte Google est déjà lié à un autre accès.');
    else { const m = authErrMsg(e); if(m) alert(m); }
  }
}

function bindLogin(){
  if(ui.bootstrap) return bindBootstrap();
  // un message d'erreur doit survivre au réaffichage de l'écran (la connexion le déclenche)
  const fail = m => { ui.loginMsg = m || ''; render(); };
  if(ui.iosInvite){
    const b = $('#ios-continue');
    if(b) b.addEventListener('click', async () => {
      b.disabled = true; ui.loginMsg = '';
      const res = await claimInvite(ui.iosInvite);
      if(res.ok){ ui.iosInvite = null; location.reload(); return; }
      fail(res.err);
    });
    return;
  }
  const code = $('#login-code'), go = $('#login-go');
  if(!go) return;
  const enter = async () => {
    ui.loginMsg = '';
    go.disabled = true; go.textContent = 'Connexion…';
    const res = await claimInvite(code.value);
    if(res.ok){ location.reload(); return; }
    fail(res.err);
  };
  go.addEventListener('click', enter);
  code.addEventListener('keydown', e => { if(e.key==='Enter') enter(); });
  $('#login-google').addEventListener('click', async () => {
    ui.loginMsg = '';
    if(!fbAuth){ fail('Firebase Auth non disponible.'); return; }
    try{ await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch(e){ fail(authErrMsg(e)); }
  });
  $('#login-boot').addEventListener('click', e => { e.preventDefault(); ui.bootstrap = true; ui.loginMsg = ''; render(); });
}
function bindBootstrap(){
  $$('[data-boot-pick]').forEach(b => b.addEventListener('click', async () => {
    const u = user(b.dataset.bootPick); if(!u) return;
    if(!confirm("Cet appareil deviendra l'administrateur de Pupitre sous le nom « " + u.name + " ». Confirmer ?")) return;
    const ri = $('#boot-room');
    ui.loginMsg = '';
    const res = await bootstrapAdmin(u.id, ri ? ri.value : '');
    if(res.ok){ location.reload(); return; }
    ui.loginMsg = res.err; render();
  }));
  $('#boot-cancel').addEventListener('click', e => { e.preventDefault(); ui.bootstrap = false; ui.loginMsg = ''; render(); });
}

  const ev = event(eid); if(!ev || !ev.journal) return;
  const n = ev.journal.find(x=>x.id===nid);
  if(!n) return;
  if(n.userId!==ui.currentUserId && !isAdmin(eid)){ alert('Tu ne peux pas supprimer cette note.'); return; }
  if(!confirm('Supprimer cette note ?')) return;
  ev.journal = ev.journal.filter(x=>x.id!==nid);
  save(); render();
}));
}

function shiftMonth(ym,n){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y,m-1+n,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  const s = new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function renderCalendar(){
  fixFilter();
  const today = todayISO();
  const ym = ui.calMonth || today.slice(0,7);
  const [y,m] = ym.split('-').map(Number);
  const offset = (new Date(y,m-1,1).getDay()+6)%7; // semaine qui commence le lundi
  const nb = new Date(y,m,0).getDate();
  const evts = data.events
    .filter(e => (e.date||'').slice(0,7)===ym && myGroups().some(g=>g.id===e.groupId && gFilter(g)))
    .sort((a,b)=> a.date.localeCompare(b.date) || (a.start||'').localeCompare(b.start||''));
  const cells = [];
  for(let i=0;i<offset;i++) cells.push('<div class="cal-day empty-day"></div>');
  for(let d=1; d<=nb; d++){
    const iso = ym+'-'+String(d).padStart(2,'0');
    const de = evts.filter(e=>e.date===iso);
    cells.push(`<div class="cal-day ${iso===today?'today':''}">
      <div class="cal-num">${d}</div>
      ${de.map(e=>{
        const g = group(e.groupId), t = typeOf(e.type);
        const warn = iso>=today && conflictsFor(e).length;
        return `<div class="cal-ev" data-open-event="${e.id}" style="border-left-color:${g.color}" title="${esc(g.name)}">
          <span>${t.icon}</span><span class="cal-txt">${esc(e.start||'')} ${esc(g.name)}</span>
          ${warn?'<span style="color:var(--warn)">⚠</span>':''}</div>`;
      }).join('')}
    </div>`);
  }
  const dows = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  return `
       <div class="row between"><h1>Calendrier</h1><button class="btn sm" data-ics-all>📅 Agenda</button></div>
    ${renderGroupFilter()}
    <div class="row between" style="margin:14px 0 10px">
      <button class="btn sm" data-cal-nav="-1">←</button>
      <div style="text-align:center">
        <strong>${esc(monthLabel(ym))}</strong>
        <div><button class="btn ghost sm" data-cal-nav="today">Aujourd'hui</button></div>
      </div>
      <button class="btn sm" data-cal-nav="1">→</button>
    </div>
    <div class="cal">
      ${dows.map(x=>`<div class="cal-dow">${x}</div>`).join('')}
      ${cells.join('')}
    </div>
    <h2>Événements du mois</h2>
    ${evts.length ? evts.map(e=>{
      const g = group(e.groupId);
      return `<div class="sub" style="margin:10px 0 4px">
        <span class="group-dot" style="background:${g.color};display:inline-block;vertical-align:middle"></span> ${esc(g.name)}</div>
        ${renderEventCard(e, e.date<today)}`;
    }).join('') : `<div class="empty">Aucun événement ce mois-ci.</div>`}
  `;
}
function normStr(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function searchAll(query){
  const q = normStr(query);
  if(q.length < 2) return null;
  const myGids = myGroups().map(g=>g.id);
  const out = { songs:[], events:[], tasks:[], comments:[] };

  // Morceaux
  data.songs.forEach(s=>{
    if(!myGids.includes(s.groupId)) return;
    const fields = [
      {label:'Titre',     value:s.title},
      {label:'Tonalité',  value:s.key},
      {label:'Structure', value:s.structure},
      {label:'Accords',   value:s.chords},
      {label:'Paroles',   value:s.lyrics},
      {label:'Notes',     value:s.notes},
    ];
    Object.values(s.parts||{}).forEach(v=>{
      if(v) fields.push({label:'Partie', value:v});
    });
    const hits = fields.filter(f=>normStr(f.value).includes(q));
    if(hits.length) out.songs.push({item:s, hits});
  });

  // Événements
  data.events.forEach(e=>{
    if(!myGids.includes(e.groupId)) return;
    const fields = [
      {label:'Lieu', value:e.location},
      {label:'Notes', value:e.notes},
    ];
    (e.journal||[]).forEach(n=>{
      if(n.worked) fields.push({label:'Journal ✓', value:n.worked});
      if(n.review) fields.push({label:'Journal ✎', value:n.review});
      if(n.next)   fields.push({label:'Journal →', value:n.next});
    });
    const hits = fields.filter(f=>normStr(f.value).includes(q));
    if(hits.length) out.events.push({item:e, hits});
  });

  // Tâches
  data.tasks.forEach(t=>{
    if(!myGids.includes(t.groupId)) return;
    if(normStr(t.title).includes(q)) out.tasks.push({item:t, hits:[{label:'Titre', value:t.title}]});
  });

  // Commentaires
  data.comments.forEach(c=>{
    if(!normStr(c.text).includes(q)) return;
    let target = null;
    if(c.targetType==='song'){
      const s = song(c.targetId);
      if(s && myGids.includes(s.groupId)) target = {type:'song', item:s};
    } else if(c.targetType==='event'){
      const ev = event(c.targetId);
      if(ev && myGids.includes(ev.groupId)) target = {type:'event', item:ev};
    }
    if(target) out.comments.push({item:c, target, hits:[{label:'Commentaire', value:c.text}]});
  });

  return out;
}

function snip(text, query){
  const s = String(text||'');
  const n = normStr(s), q = normStr(query);
  const i = n.indexOf(q);
  if(i < 0) return esc(s.slice(0,120));
  const start = Math.max(0, i-40);
  const end   = Math.min(s.length, i+q.length+80);
  const before = s.slice(start, i);
  const mid    = s.slice(i, i+q.length);
  const after  = s.slice(i+q.length, end);
  return (start>0?'…':'') + esc(before)
    + '<mark style="background:var(--accent);color:#fff;padding:0 2px;border-radius:3px">' + esc(mid) + '</mark>'
    + esc(after) + (end<s.length?'…':'');
}

function renderSearchResults(){
  const q = (ui.searchQuery||'').trim();
  if(q.length < 2) return `<div class="empty">Tape au moins 2 lettres pour lancer la recherche.</div>`;
  const r = searchAll(q);
  const total = r.songs.length + r.events.length + r.tasks.length + r.comments.length;
  if(!total) return `<div class="empty">Aucun résultat pour « ${esc(q)} ».</div>`;

  const songHtml = r.songs.map(({item:s, hits})=>{
    const g = group(s.groupId), st = statusOf(s.status);
    return `<div class="li clickable" data-open-song="${s.id}">
      <div class="grow">
        <div class="title">${esc(s.title)}</div>
        <div class="meta">
          <span class="group-dot" style="background:${g.color};display:inline-block;vertical-align:middle"></span>
          ${esc(g.name)}
          <span class="badge" style="margin-left:6px"><span class="b-dot" style="background:${st.color}"></span>${esc(st.label)}</span>
        </div>
        ${hits.filter(h=>h.label!=='Titre').slice(0,3).map(h=>`<div class="small" style="margin-top:4px"><span class="muted">${esc(h.label)} :</span> ${snip(h.value,q)}</div>`).join('')}
      </div>
    </div>`;
  }).join('');

  const evHtml = r.events.map(({item:e, hits})=>{
    const g = group(e.groupId), t = typeOf(e.type);
    return `<div class="li clickable" data-open-event="${e.id}">
      <div class="grow">
        <div class="title">${t.icon} ${esc(t.label)} — ${esc(e.location || fmtDateShort(e.date))}</div>
        <div class="meta">
          <span class="group-dot" style="background:${g.color};display:inline-block;vertical-align:middle"></span>
          ${esc(g.name)} · ${esc(fmtDate(e.date))}
        </div>
        ${hits.slice(0,3).map(h=>`<div class="small" style="margin-top:4px"><span class="muted">${esc(h.label)} :</span> ${snip(h.value,q)}</div>`).join('')}
      </div>
    </div>`;
  }).join('');

  const taskHtml = r.tasks.map(({item:t})=>{
    const g = group(t.groupId);
    return `<div class="li clickable" data-open-task="${t.id}">
      <div class="grow">
        <div class="title">${esc(t.title)}</div>
        <div class="meta">
          <span class="group-dot" style="background:${g.color};display:inline-block;vertical-align:middle"></span>
          ${esc(g.name)}${t.due?' · '+esc(fmtDateShort(t.due)):''}
        </div>
      </div>
    </div>`;
  }).join('');

  const cmtHtml = r.comments.map(({item:c, target})=>{
    const u = user(c.userId) || {name:'?',initials:'?',color:'#666'};
    const label = target.type==='song'
      ? target.item.title
      : (typeOf(target.item.type).label + ' · ' + fmtDateShort(target.item.date));
    const attr = target.type==='song'
      ? `data-open-song="${target.item.id}"`
      : `data-open-event="${target.item.id}"`;
    return `<div class="li clickable" ${attr}>
      <div class="avatar" style="background:${u.color};width:28px;height:28px;font-size:11px">${esc(u.initials)}</div>
      <div class="grow">
        <div class="title" style="font-size:14px">${esc(u.name)} <span class="muted">sur</span> ${esc(label)}</div>
        <div class="small" style="margin-top:4px">${snip(c.text, q)}</div>
      </div>
    </div>`;
  }).join('');

  return `<p class="sub" style="margin-bottom:14px">${total} résultat${total>1?'s':''}</p>
    ${r.songs.length    ? `<h2>Morceaux <span class="muted small">(${r.songs.length})</span></h2><div class="list">${songHtml}</div>`:''}
    ${r.events.length   ? `<h2>Événements <span class="muted small">(${r.events.length})</span></h2><div class="list">${evHtml}</div>`:''}
    ${r.tasks.length    ? `<h2>Tâches <span class="muted small">(${r.tasks.length})</span></h2><div class="list">${taskHtml}</div>`:''}
    ${r.comments.length ? `<h2>Commentaires <span class="muted small">(${r.comments.length})</span></h2><div class="list">${cmtHtml}</div>`:''}
  `;
}

   {id:'events',     label:'Événements'},

function renderPipeline(list){
  return `<div class="kanban">
    ${SONG_STATUSES.map(st=>{
      const items = list.filter(s=>s.status===st.id);
      return `<div class="kcol">
        <h3><span style="display:flex;align-items:center;gap:6px">
          <span class="b-dot" style="background:${st.color};width:8px;height:8px;border-radius:50%"></span>

          <span class="kcount">${items.length}</span></h3>
        ${items.map(s=>`
          <div class="kcard" data-open-song="${s.id}">
            <div class="kt">${esc(s.title)}</div>
            <div class="km">
              ${s.key?`<span>${esc(s.key)}</span>`:''}
              ${s.bpm?`<span>${s.bpm} BPM</span>`:''}

function toMin(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}
function eventRange(e){
  const s = toMin(e.start); if(s===null) return null;
  let en = toMin(e.end);
  if(en===null || en<=s) en = s+120; // sans heure de fin : on compte 2 h
  return [s,en];
}
function conflictsFor(e){
  const r = eventRange(e); if(!r) return [];
  const g = group(e.groupId); if(!g) return [];
  const ids = g.memberships.map(m=>m.userId);
  return data.events.filter(x=>{
    if(x.id===e.id || x.date!==e.date) return false;
        if(!myGroups().some(mg=>mg.id===x.groupId)) return false;
    const r2 = eventRange(x); if(!r2) return false;
    if(!(r[0]<r2[1] && r2[0]<r[1])) return false;
    const g2 = group(x.groupId); if(!g2) return false;
    return g2.memberships.some(m=>ids.includes(m.userId));
  });
}
function conflictLabel(e,x){
  const g1 = group(e.groupId), g2 = group(x.groupId);
  const ids1 = g1.memberships.map(m=>m.userId);
  const shared = g2.memberships.filter(m=>ids1.includes(m.userId))
    .map(m=>user(m.userId)?.name).filter(Boolean);
  return g2.name+' — '+typeOf(x.type).label+' ('+(x.start||'')+(x.end?'–'+x.end:'')+') · '+shared.join(', ');
}
function conflictBanner(e){
  if(e.date<todayISO()) return '';
  const c = conflictsFor(e); if(!c.length) return '';
  return `<div class="small" style="color:var(--warn);margin-top:8px">⚠ Conflit d'agenda : ${c.map(x=>esc(conflictLabel(e,x))).join(' | ')}</div>`;
}
function availSummary(e, detail){
  const g = group(e.groupId); if(!g) return '';
  const av = e.availability || {};
  let oui=0, peut=0, non=0;
  const waiting = [];
  g.memberships.forEach(m=>{
    const v = av[m.userId];
    if(v==='oui') oui++;
    else if(v==='peut') peut++;
    else if(v==='non') non++;
    else { const u = user(m.userId); if(u) waiting.push(u.name); }
  });
  const parts = [];
  if(oui)  parts.push(`<span style="color:var(--ok)">✓ ${oui} oui</span>`);
  if(peut) parts.push(`<span style="color:var(--warn)">? ${peut} peut-être</span>`);
  if(non)  parts.push(`<span style="color:var(--danger)">✗ ${non} non</span>`);
  if(waiting.length){
    parts.push(`<span class="muted">${oui+peut+non ? waiting.length+' sans réponse' : 'Aucune réponse'}${detail ? ' : '+waiting.map(esc).join(', ') : ''}</span>`);
  }
  if(!parts.length) return '';
  return `<div class="small" style="margin:${detail?'0 0 10px':'8px 0 0'};display:flex;gap:12px;flex-wrap:wrap">${parts.join('')}</div>`;
}
/* ============ CONCERTS : TABLEAU DE BORD + FINANCES (administrateur seul) ============ */
// Les montants sont stockés à part (finances/<groupe>/<événement>), lisibles uniquement par l'administrateur
// grâce aux règles Firebase : ils ne passent jamais par les appareils des autres musiciens.
let fin = {};            // eventId -> {cachet, received, cash, expenses:[{id,label,amount}], shares:{userId:{in,part,paid}}}
let finState = 'idle';   // idle | loading | ok | err
let finGroups = {};      // groupes dont l'administrateur principal m'a ouvert les finances : {groupId:true}
let finAccessAll = {};   // vu par l'administrateur principal : {userId:{groupId:true}}
const canFin = gid => isRoomAdmin() || !!finGroups[gid];
const canFinAny = () => isRoomAdmin() || Object.keys(finGroups).length > 0;
const finAccessOn = (uid_, gid) => !!(finAccessAll[uid_] && finAccessAll[uid_][gid]);
const eur = n => (Number(n)||0).toLocaleString('fr-FR', {style:'currency', currency:'EUR'});
const num = v => { const x = parseFloat(String(v==null ? '' : v).replace(',', '.')); return isFinite(x) ? x : 0; };

async function finLoad(force){
  if(!sync || !canFinAny()) return;
  if(!force && finState !== 'idle') return;
  finState = 'loading';
  try{
    const room = encodeURIComponent(sync.room);
    const flat = {};
    if(isRoomAdmin()){
      const r = await dbCall('GET', 'finances/' + room);
      if(!r.ok) throw new Error('statut ' + r.status);
      const raw = (await r.json()) || {};
      const legacy = [];
      Object.keys(raw).forEach(k => {
        const v = raw[k]; if(!v || typeof v !== 'object') return;
        if(group(k)) Object.keys(v).forEach(eid => { flat[eid] = v[eid]; });
        else if(event(k)) legacy.push(k);                  // ancien format : finances/<événement>
      });
      const upd = {};
      legacy.forEach(k => {
        const ev = event(k);
        if(!(k in flat)){ flat[k] = raw[k]; upd[ev.groupId + '/' + k] = raw[k]; }
        upd[k] = null;
      });
      if(Object.keys(upd).length){ try{ await dbCall('PATCH', 'finances/' + room, upd); }catch(e){} }
    } else {
      for(const gid of Object.keys(finGroups)){
        const r = await dbCall('GET', 'finances/' + room + '/' + encodeURIComponent(gid));
        if(!r.ok) throw new Error('statut ' + r.status);
        const v = (await r.json()) || {};
        Object.keys(v).forEach(eid => { flat[eid] = v[eid]; });
      }
    }
    fin = flat;
    finState = 'ok';
  }catch(e){ finState = 'err'; }
  if(idle() && (ui.view === 'concerts' || ui.view === 'event')) render();
}
async function finSave(eid){
  const ev = event(eid);
  if(!sync || !ev || !canFin(ev.groupId)) return;
  try{
    const r = await dbCall('PUT', 'finances/' + encodeURIComponent(sync.room) + '/' + encodeURIComponent(ev.groupId) + '/' + eid, fin[eid] || null);
    if(!r.ok) throw new Error('statut ' + r.status);
  }catch(e){ alert("Enregistrement des finances impossible (" + ((e && e.message) || e) + "). Vérifie la connexion, puis réessaie."); }
}
async function loadFinAccess(){
  if(!sync || !fbAuth || !fbAuth.currentUser || !myMember) return;
  const room = encodeURIComponent(sync.room);
  try{
    if(isRoomAdmin()){
      const r = await dbCall('GET', 'financeAccess/' + room); if(!r.ok) return;
      finAccessAll = (await r.json()) || {};
    } else {
      const r = await dbCall('GET', 'financeAccess/' + room + '/' + encodeURIComponent(myMember.userId)); if(!r.ok) return;
      const v = (await r.json()) || {}, next = {};
      Object.keys(v).forEach(k => { if(v[k] === true) next[k] = true; });
      if(JSON.stringify(next) !== JSON.stringify(finGroups)){ finGroups = next; finState = 'idle'; if(idle()) render(); }
    }
  }catch(e){}
}
async function toggleFinAccess(gid, userId){
  if(!isRoomAdmin() || !sync) return;
  const u = user(userId), g = group(gid); if(!u || !g) return;
  const on = finAccessOn(userId, gid);
  const msg = on
    ? "Retirer à « " + u.name + " » l'accès aux finances de « " + g.name + " » ?"
    : "Donner à « " + u.name + " » l'accès aux finances de « " + g.name + " » ?\n\nIl pourra voir et modifier les cachets, frais et répartitions des concerts de ce groupe uniquement.";
  if(!confirm(msg)) return;
  try{
    const path = 'financeAccess/' + encodeURIComponent(sync.room) + '/' + encodeURIComponent(userId) + '/' + encodeURIComponent(gid);
    const r = on ? await dbCall('DELETE', path) : await dbCall('PUT', path, true);
    if(!r.ok) throw new Error('statut ' + r.status);
    finAccessAll[userId] = finAccessAll[userId] || {};
    if(on) delete finAccessAll[userId][gid]; else finAccessAll[userId][gid] = true;
    render();
  }catch(e){
    alert("Impossible (" + ((e && e.message) || e) + "). Vérifie que les nouvelles règles Firebase sont bien publiées.");
  }
}
function bindFinAccess(){
  $$('[data-fin-access]').forEach(b => b.addEventListener('click', () => {
    const [gid, uid_] = b.dataset.finAccess.split(':');
    toggleFinAccess(gid, uid_);
  }));
}
function finMut(eid, fn){
  const next = JSON.parse(JSON.stringify(fin[eid] || {}));
  next.expenses = Array.isArray(next.expenses) ? next.expenses : Object.values(next.expenses || {});
  next.shares = next.shares || {};
  fn(next);
  fin[eid] = next;
  finSave(eid); render();
}
function finOf(e){
  const f = fin[e.id] || {};
  const g = group(e.groupId);
  const shares = {};
  (g ? g.memberships : []).forEach(m => {
    const s = (f.shares || {})[m.userId] || {};
    shares[m.userId] = {in: s.in !== false, part: s.part !== undefined ? num(s.part) : 1, paid: !!s.paid};
  });
  const exp = Array.isArray(f.expenses) ? f.expenses : Object.values(f.expenses || {});
  return {cachet: num(f.cachet), received: !!f.received, cash: num(f.cash), expenses: exp.filter(Boolean), shares};
}
function finCalc(e){
  const f = finOf(e);
  const frais = f.expenses.reduce((n, x) => n + num(x.amount), 0);
  const net = f.cachet - frais;
  const dist = Math.max(0, net - f.cash);
  const ids = Object.keys(f.shares).filter(id => f.shares[id].in && f.shares[id].part > 0);
  const totalPart = ids.reduce((n, id) => n + f.shares[id].part, 0);
  const amounts = {};
  let given = 0;
  ids.forEach((id, i) => {
    let a = totalPart ? Math.round(dist * f.shares[id].part / totalPart * 100) / 100 : 0;
    if(i === ids.length - 1) a = Math.round((dist - given) * 100) / 100;
    amounts[id] = a; given += a;
  });
  const owed = f.received ? ids.reduce((n, id) => n + (f.shares[id].paid ? 0 : amounts[id]), 0) : 0;
  return {f, frais, net, dist, amounts, ids, owed};
}

        <div class="avail-row"><div class="grow">${esc(x.label)}</div><div>${eur(x.amount)}</div>
          <button class="btn ghost sm danger" data-fin-exp-del="${eid}:${esc(x.id)}">✕</button></div>`).join('')
        : `<div class="muted small">Aucun frais (essence, location de matériel, repas…).</div>`}
      <div class="small" style="margin:12px 0;padding:10px;background:var(--panel2);border-radius:8px;line-height:1.7">
        Cachet ${eur(f.cachet)} − frais ${eur(c.frais)} = <strong>net ${eur(c.net)}</strong>${f.cash ? ` − caisse ${eur(f.cash)}` : ''}<br>
        À répartir : <strong>${eur(c.dist)}</strong>${c.net < 0 ? ` <span style="color:var(--warn)">· les frais dépassent le cachet</span>` : ''}
      </div>
      <h3>Répartition</h3>
      ${g.memberships.map(m => {
        const u = user(m.userId); if(!u) return '';
        const s = f.shares[u.id];
        const a = c.amounts[u.id];
        return `<div class="avail-row">
          <input type="checkbox" data-fin-share="${eid}:${u.id}:in" ${s.in ? 'checked' : ''} title="A joué ce concert">
          <div class="avatar" style="background:${u.color};width:28px;height:28px;font-size:12px">${esc(u.initials)}</div>

          <input inputmode="decimal" data-fin-share-part="${eid}:${u.id}" value="${s.part}" title="Part (1 = part normale)" style="width:56px;text-align:center" ${s.in ? '' : 'disabled'}>
          <div style="min-width:78px;text-align:right;font-weight:600">${s.in ? eur(a) : '—'}</div>
          <label class="small" style="display:flex;align-items:center;gap:4px;white-space:nowrap"><input type="checkbox" data-fin-share="${eid}:${u.id}:paid" ${s.paid ? 'checked' : ''} ${s.in ? '' : 'disabled'}> payé</label>
        </div>`;
      }).join('')}
      <div class="muted small" style="margin-top:8px">La case à gauche indique qui a joué. « Part » : 1 pour une part normale, 0,5 pour une demi-part.</div>
    </div>`;
}

function bindFinance(){
  const rt = $('[data-fin-retry]'); if(rt) rt.addEventListener('click', () => { finState = 'idle'; finLoad(true); });

function exportFinanceCsv(){
  const rows = [['Date','Groupe','Lieu','Cachet brut','Frais','Mise en caisse','Cachet reçu','Musicien','Part','Payé']];
  concertsList().filter(e => canFin(e.groupId)).sort((a,b) => a.date.localeCompare(b.date)).forEach(e => {
    const c = finCalc(e), g = group(e.groupId);
    if(!c.f.cachet && !c.f.expenses.length) return;
    const base = [e.date, g ? g.name : '', e.location || '', c.f.cachet, c.frais, c.f.cash, c.f.received ? 'oui' : 'non'];
    if(!c.ids.length) rows.push(base.concat(['','','']));
    c.ids.forEach(id => { const u = user(id); rows.push(base.concat([u ? u.name : id, c.amounts[id], c.f.shares[id].paid ? 'oui' : 'non'])); });
  });
  const cell = v => { const s = String(v == null ? '' : v).replace(/\./g, typeof v === 'number' ? ',' : '.'); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const txt = '\ufeff' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/csv;charset=utf-8'}));
  a.download = 'pupitre-concerts-' + todayISO() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

        ${owedRows ? `<div class="small" style="margin:10px 0">À reverser : ${owedRows}</div>` : ''}`;
    } else if(finState === 'err'){
      money = `<div class="card"><div class="small" style="color:var(--danger)">Impossible de charger les finances (connexion ou règles Firebase).</div><button class="btn sm" data-fin-retry style="margin-top:8px">Réessayer</button></div>`;
    } else {
      money = `<div class="card muted small">Chargement des finances…</div>`;
    }
  }
  return `
    <h1>Concerts</h1>
    <p class="sub">Préparation et suivi de toutes tes dates.</p>
    ${renderGroupFilter()}
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:6px 0 4px">
      ${kpi(up.length, 'concert' + (up.length > 1 ? 's' : '') + ' à venir')}
      ${kpi(up.length ? fmtRelative(up[0].date) : '—', 'prochaine date')}
      ${kpi(noSet, 'sans setlist', noSet ? 'var(--warn)' : '')}
      ${kpi(missing, 'réponses de dispo manquantes', missing ? 'var(--warn)' : '')}
    </div>
    ${money}
    <h2>À venir</h2>
    ${up.length ? up.map(e => renderConcertCard(e, false)).join('') : `<div class="empty">Aucun concert à venir. Ajoute-en un depuis la page d'un groupe (onglet Événements).</div>`}
    ${past.length ? `<h2>Passés</h2>${past.map(e => renderConcertCard(e, true)).join('')}` : ''}
  `;
}
function renderConcertCard(e, isPast){
  const g = group(e.groupId); if(!g) return '';
  const sl = (e.setlist||[]).map(id => song(id)).filter(Boolean);
  const tot = sl.reduce((n, s) => n + durSec(s.duration), 0);
  const t = techOf(e);
  const techN = (t.patch||[]).length + (t.gear||[]).length + (t.stage ? 1 : 0) + (t.stageImg ? 1 : 0);
  const cl = e.checklist || [];
  const clDone = cl.filter(c => c.done).length;
  const av = e.availability || {};
  const answered = g.memberships.filter(m => av[m.userId]).length;
  const ok = (good, txt) => `<span class="chip" style="color:${good ? 'var(--ok)' : 'var(--warn)'}">${good ? '✓' : '•'} ${esc(txt)}</span>`;
  const chips = [];
  chips.push(sl.length ? ok(true, sl.length + ' morceau' + (sl.length > 1 ? 'x' : '') + (tot ? ' · ' + fmtTotal(tot) : '')) : ok(false, 'Setlist à préparer'));
  if(!isPast){
    chips.push(ok(answered === g.memberships.length, 'Dispos ' + answered + '/' + g.memberships.length));
    chips.push(techN ? ok(true, 'Fiche technique : ' + techN + ' élément' + (techN > 1 ? 's' : '')) : ok(false, 'Fiche technique vide'));
    if(cl.length) chips.push(ok(clDone === cl.length, 'À faire ' + clDone + '/' + cl.length));
  }
  if(canFin(e.groupId) && finState === 'ok'){
    const c = finCalc(e);
    chips.push(c.f.cachet ? ok(c.f.received, 'Cachet ' + eur(c.f.cachet) + (c.f.received ? ' reçu' : ' à encaisser')) : ok(false, 'Cachet à saisir'));
  }
  return `<div class="card clickable" data-open-event="${e.id}" style="${isPast ? 'opacity:.75' : ''}">
    <div class="row between">
      <div>
        <div style="font-weight:600">🎤 ${esc(e.location || 'Concert')} <span class="chip" style="margin-left:6px"><span class="group-dot" style="background:${g.color}"></span>${esc(g.name)}</span></div>
        <div class="sub">${esc(fmtDate(e.date))} · ${esc(e.start || '')}${e.end ? '–' + esc(e.end) : ''}</div>
      </div>
      ${isPast ? '' : `<span class="badge">${esc(fmtRelative(e.date))}</span>`}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${chips.join('')}</div>
  </div>`;
}

/* ============ SETLIST EN PDF (sans bibliothèque : fonctionne aussi hors ligne) ============ */
const HELV_W = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WIN1252 = {'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F};
function pdfEnc(str){
  let out = '';
  for(const ch of String(str)){
    const c = ch.codePointAt(0);
    if(WIN1252[ch] !== undefined) out += String.fromCharCode(WIN1252[ch]);
    else if(c >= 32 && c < 256) out += String.fromCharCode(c);
    else out += '?';
  }
  return out;
}
const pdfEsc = s => pdfEnc(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
function pdfW(str, size, bold){
  let w = 0;
  for(const ch of String(str)){
    let c = ch.codePointAt(0);
    if(c < 32 || c > 126){ const b = ch.normalize('NFD')[0]; c = b ? b.codePointAt(0) : 63; }
    w += (c >= 32 && c <= 126) ? HELV_W[c - 32] : 556;
  }
  return w * size / 1000 * (bold ? 1.07 : 1);
}
function pdfFit(str, size, maxW, bold, minSize){
  let s = size;
  while(s > minSize && pdfW(str, s, bold) > maxW) s -= 0.5;
  let t = String(str);
  if(pdfW(t, s, bold) <= maxW) return {text:t, size:s};
  while(t.length > 1 && pdfW(t + '…', s, bold) > maxW) t = t.slice(0, -1);
  return {text:t + '…', size:s};
}
function buildSetlistPdf(e, opt){
  const g = group(e.groupId);
  const isRep = e.type === 'repetition';
  const list = (e.setlist||[]).map(id => song(id)).filter(Boolean);
  const big = opt.layout !== 'compact', det = opt.details !== false;
  const W = 595, H = 842, M = 48;
  const pages = [];
  let ops = null, y = 0;
  const T = (x, yy, s, size, bold, gray) => `BT ${gray === undefined ? 0 : gray} g /${bold ? 'F2' : 'F1'} ${size} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${pdfEsc(s)}) Tj ET\n`;
  const TR = (xr, yy, s, size, bold, gray) => T(xr - pdfW(s, size, bold), yy, s, size, bold, gray);
  const LN = (yy, gray, wd) => `${gray} G ${wd || 0.6} w ${M} ${yy.toFixed(1)} m ${W - M} ${yy.toFixed(1)} l S\n`;
  function newPage(first){
    ops = []; pages.push(ops); y = H - M;
    if(first){
      ops.push(T(M, y - 8, (g ? g.name : '').toUpperCase(), 12, true, 0.45));
      ops.push(T(M, y - 46, isRep ? 'À travailler' : 'Setlist', 32, true, 0));
      const when = [fmtDate(e.date), (e.start || '') + (e.end ? '–' + e.end : '')].filter(s => s && s.trim()).join(' · ');
      const sub = [when, e.location].filter(Boolean).join(' · ');
      const f = pdfFit(sub, 12, W - 2 * M, false, 9);
      ops.push(T(M, y - 68, f.text, f.size, false, 0.35));
      ops.push(LN(y - 82, 0.75, 1));
      y -= 104;
    } else {
      ops.push(T(M, y - 6, (g ? g.name : '') + ' · ' + (isRep ? 'À travailler' : 'Setlist') + ' (suite)', 10, false, 0.45));
      y -= 30;
    }
  }
  newPage(true);
  const rowH = big ? 46 : 24;
  let tot = 0;
  list.forEach((s, i) => {
    if(y - rowH < M + 40) newPage(false);
    const d = durSec(s.duration); tot += d;
    const meta = det ? [s.key, s.bpm ? s.bpm + ' BPM' : '', d ? fmtDur(d) : ''].filter(Boolean).join('   ·   ') : '';
    const base = y - (big ? 26 : 15);
    const numW = big ? 44 : 28;
    const metaW = meta ? pdfW(meta, big ? 13 : 10, false) + 16 : 0;
    const f = pdfFit(s.title || '', big ? 24 : 13, W - 2 * M - numW - metaW, true, big ? 14 : 9);
    ops.push(T(M, base, String(i + 1), big ? 20 : 11, true, 0.55));
    ops.push(T(M + numW, base, f.text, f.size, true, 0));
    if(meta) ops.push(TR(W - M, base, meta, big ? 13 : 10, false, 0.35));
    ops.push(LN(y - rowH + 6, 0.88, 0.5));
    y -= rowH;
  });
  if(y - 40 < M) newPage(false);
  const summary = list.length + ' morceau' + (list.length > 1 ? 'x' : '') + (tot ? '   ·   durée totale environ ' + fmtTotal(tot) : '');
  ops.push(T(M, y - 20, summary, 12, true, 0.35));
  const N = pages.length;
  pages.forEach((p, i) => {
    p.push(T(M, 28, 'Pupitre', 9, false, 0.6));
    p.push(TR(W - M, 28, 'page ' + (i + 1) + '/' + N, 9, false, 0.6));
  });
  const objs = [null];
  objs[1] = '<</Type/Catalog/Pages 2 0 R>>';
  objs[2] = '<</Type/Pages/Count ' + N + '/Kids[' + pages.map((_, i) => (5 + 2 * i) + ' 0 R').join(' ') + ']>>';
  objs[3] = '<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>';
  objs[4] = '<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>';
  pages.forEach((p, i) => {
    const content = p.join('');
    objs[5 + 2 * i] = '<</Type/Page/Parent 2 0 R/MediaBox[0 0 ' + W + ' ' + H + ']/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ' + (6 + 2 * i) + ' 0 R>>';
    objs[6 + 2 * i] = '<</Length ' + content.length + '>>\nstream\n' + content + '\nendstream';
  });
  let out = '%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n';
  const offs = [];
  for(let i = 1; i < objs.length; i++){ offs[i] = out.length; out += i + ' 0 obj\n' + objs[i] + '\nendobj\n'; }
  const xref = out.length;
  out += 'xref\n0 ' + objs.length + '\n0000000000 65535 f \n' + offs.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('')
       + 'trailer\n<</Size ' + objs.length + '/Root 1 0 R>>\nstartxref\n' + xref + '\n%%EOF';
  const u8 = new Uint8Array(out.length);
  for(let i = 0; i < out.length; i++) u8[i] = out.charCodeAt(i) & 255;
  return u8;
}
async function shareSetlistPdf(e, opt){
  const g = group(e.groupId);
  const bytes = buildSetlistPdf(e, opt);
  const slug = String((g && g.name) || 'groupe').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const name = (e.type === 'repetition' ? 'a-travailler-' : 'setlist-') + slug + '-' + e.date + '.pdf';
  const file = new File([bytes], name, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:(e.type === 'repetition' ? 'À travailler' : 'Setlist') + ' · ' + (g ? g.name : '')}); return; }
    catch(err){ if(err && err.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ============ SUIVI DU TRAVAIL PAR MORCEAU ============ */
// Un morceau est « travaillé » quand il figure dans la liste « à travailler » d'une répétition déjà passée.
function isDone(e){
  const t = todayISO();
  if(e.date < t) return true;
  if(e.date > t) return false;
  if(!e.start) return false;
  const n = new Date();
  return e.start <= String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}
function daysBetween(a, b){
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function fmtAgo(d){
  if(d <= 0) return "aujourd'hui";
  if(d === 1) return 'hier';
  if(d < 14) return 'il y a ' + d + ' jours';
  if(d < 60) return 'il y a ' + Math.round(d / 7) + ' semaines';
  const m = Math.round(d / 30.4);
  if(m < 12) return 'il y a ' + m + ' mois';
  const y = Math.floor(m / 12), r = m % 12;
  return 'il y a ' + y + ' an' + (y > 1 ? 's' : '') + (r ? ' et ' + r + ' mois' : '');
}
function songWork(s){
  const has = e => e.groupId === s.groupId && (e.setlist || []).includes(s.id);
  const rep = data.events.filter(e => e.type === 'repetition' && has(e) && isDone(e)).sort((a, b) => a.date.localeCompare(b.date));
  const con = data.events.filter(e => e.type === 'concert' && has(e) && isDone(e)).sort((a, b) => a.date.localeCompare(b.date));
  const next = data.events.filter(e => e.type === 'repetition' && has(e) && !isDone(e)).sort((a, b) => a.date.localeCompare(b.date))[0] || null;
  return {rep, con, next, last: rep.length ? rep[rep.length - 1].date : null, first: rep.length ? rep[0].date : null};
}
function renderSongWork(s){
  const w = songWork(s), today = todayISO();
  const n = w.rep.length;
  const days = w.last ? daysBetween(w.last, today) : null;
  const recent = w.rep.filter(e => e.date >= addDays(today, -30)).length;
  const stale = days !== null && days > 30 && s.status !== 'archive';
  const kpi = (v, l, c) => `<div class="card" style="margin:0;padding:12px"><div style="font-size:20px;font-weight:700;${c ? 'color:' + c : ''}">${v}</div><div class="muted small">${l}</div></div>`;
  const since = (s.createdAt && /^\d{4}-\d{2}-\d{2}$/.test(s.createdAt)) ? daysBetween(s.createdAt, today) : null;
  const dates = w.rep.slice(-6).reverse().map(e => esc(fmtDateShort(e.date))).join(' · ');
  return `<div class="card">
    <h3>📈 Travail en répétition</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
      ${kpi(n, 'répétition' + (n > 1 ? 's' : '') + ' où il était à travailler')}
      ${kpi(days === null ? '—' : esc(fmtAgo(days)), 'dernière fois', stale ? 'var(--warn)' : '')}
      ${kpi(recent, 'sur les 30 derniers jours')}
      ${kpi(w.con.length, 'concert' + (w.con.length > 1 ? 's' : '') + ' joué' + (w.con.length > 1 ? 's' : ''))}
    </div>
    <div class="small" style="margin-top:10px;line-height:1.7">
      ${n ? `Premier travail : ${esc(fmtDate(w.first))}.<br>Dernières répétitions : ${dates}.` : `<span class="muted">Ce morceau n'a encore été mis dans aucune liste « à travailler » d'une répétition passée.</span>`}
      ${since !== null && since > 0 ? `<br>Dans le répertoire depuis ${since < 14 ? since + ' jour' + (since > 1 ? 's' : '') : esc(fmtAgo(since).replace('il y a ', ''))}.` : ''}
      ${w.next ? `<br>Prévu à la répétition du ${esc(fmtDate(w.next.date))}.` : ''}
      ${stale ? `<br><span style="color:var(--warn)">⚠ Pas travaillé depuis plus de 30 jours.</span>` : ''}
    </div>

/* ============ ASSISTANT D'ORDRE DE SETLIST ============ */
const KEY_PC = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
function keyInfo(k){
  const m = String(k || '').trim().match(/^([A-Ga-g])([#b♯♭]?)\s*(minor|mineur|min|m(?!aj)|-)?/);
  if(!m) return null;
  let pc = KEY_PC[m[1].toUpperCase()];
  if(m[2] === '#' || m[2] === '♯') pc += 1; else if(m[2] === 'b' || m[2] === '♭') pc -= 1;
  pc = (pc + 12) % 12;
  const rel = m[3] ? (pc + 3) % 12 : pc;          // tonalité majeure relative
  return {fifths: (rel * 7) % 12};                // position sur le cercle des quintes
}
function keyDist(a, b){
  if(!a || !b) return 0;
  const d = Math.abs(a.fifths - b.fifths);
  return Math.min(d, 12 - d) / 6;                 // 0 (même famille) à 1 (opposées)
}
function setlistEnergy(songs){
  const bpms = songs.map(x => +x.bpm).filter(v => v > 0);
  const mn = Math.min(...bpms), mx = Math.max(...bpms);
  return songs.map(x => {
    const e = parseInt(x.energy);
    if(e >= 1 && e <= 5) return (e - 1) / 4;
    const b = +x.bpm;
    if(b > 0 && mx > mn) return (b - mn) / (mx - mn);
    return 0.5;
  });
}
function energyTarget(mode, t){
  if(mode === 'crescendo') return t;
  if(mode === 'fluide') return 0.3 + 0.4 * t;   // légère montée, poids faible : l'enchaînement prime
  if(mode === 'arc') return t < 0.6 ? 0.85 - 0.45 * Math.sin(Math.PI * t / 0.6) : 0.85 + 0.15 * ((t - 0.6) / 0.4);
  return null;
}
function orderCost(o, E, K, B, mode){
  const n = o.length; let c = 0;
  for(let i = 0; i < n; i++){
    const tg = energyTarget(mode, n > 1 ? i / (n - 1) : 0);
    if(tg !== null){ const d = E[o[i]] - tg; c += (mode === 'fluide' ? 1 : 5) * d * d; }
    if(i > 0){
      const a = o[i-1], b = o[i];
      c += 0.6 * keyDist(K[a], K[b]);
      if(B[a] > 0 && B[b] > 0) c += 0.5 * Math.min(1.5, Math.abs(B[a] - B[b]) / 40);
      if(mode === 'fluide') c += 1.2 * Math.abs(E[a] - E[b]);
    }
  }
  return c;
}
function mulberry(a){
  return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function rankNorm(E){
  const n = E.length; if(n < 2) return E.slice();
  const idx = [...Array(n).keys()].sort((a, b) => E[a] - E[b]);
  const r = new Array(n);
  let i = 0;
  while(i < n){
    let j = i; while(j + 1 < n && Math.abs(E[idx[j+1]] - E[idx[i]]) < 1e-9) j++;
    const avg = (i + j) / 2;
    for(let k = i; k <= j; k++) r[idx[k]] = avg / (n - 1);
    i = j + 1;
  }
  return r;
}
function proposeOrder(songs, mode, lockFirst, lockLast, seed){
  const n = songs.length;
  const E = setlistEnergy(songs), K = songs.map(x => keyInfo(x.key)), B = songs.map(x => +x.bpm || 0);
  const rnd = mulberry(seed * 7919 + 13);
  const Er = rankNorm(E);                                       // l'énergie est comparée au reste du set (rang), pas dans l'absolu
  const Ew = seed ? Er.map(v => v + (rnd() - 0.5) * 0.16) : Er; // petite variation pour les « autres propositions »
  const lo = lockFirst ? 1 : 0, hi = lockLast ? n - 2 : n - 1;
  const cost = o => orderCost(o, Ew, K, B, mode);
  let best = null, bestC = Infinity;
  for(let r = 0; r < 8; r++){
    const o = [...Array(n).keys()];
    const mid = o.slice(lo, hi + 1);
    if(r === 0 && energyTarget(mode, 0) !== null){
      const pos = mid.map((_, k) => lo + k).sort((a, b) => energyTarget(mode, a / (n - 1)) - energyTarget(mode, b / (n - 1)));
      const sg = mid.slice().sort((a, b) => Ew[a] - Ew[b]);
      pos.forEach((p, k) => { o[p] = sg[k]; });
    } else {
      for(let i = mid.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [mid[i], mid[j]] = [mid[j], mid[i]]; }
      mid.forEach((v, k) => { o[lo + k] = v; });
    }
    let c = cost(o), improved = true, guard = 0;
    while(improved && guard++ < 60){
      improved = false;
      for(let i = lo; i <= hi; i++) for(let j = i + 1; j <= hi; j++){
        [o[i], o[j]] = [o[j], o[i]];
        const c2 = cost(o);
        if(c2 < c - 1e-9){ c = c2; improved = true; } else [o[i], o[j]] = [o[j], o[i]];
      }
      for(let i = lo; i <= hi; i++) for(let j = lo; j <= hi; j++){
        if(i === j) continue;
        const x = o.splice(i, 1)[0]; o.splice(j, 0, x);
        const c2 = cost(o);
        if(c2 < c - 1e-9){ c = c2; improved = true; } else { const y = o.splice(j, 1)[0]; o.splice(i, 0, y); }
      }
    }
    if(c < bestC - 1e-9){ bestC = c; best = o.slice(); }
  }
  return {order: best, E, K, B};
}
function orderPreviewHtml(songs, res){
  const {order, E, K, B} = res;
  const unknown = songs.filter(x => !(parseInt(x.energy) >= 1) && !(+x.bpm > 0)).length;
  const rows = order.map((idx, i) => {
    const x = songs[idx];
    let warn = '';
    if(i > 0){
      const a = order[i-1];
      const w = [];
      if(keyDist(K[a], K[idx]) >= 0.67) w.push('saut de tonalité');
      if(B[a] > 0 && B[idx] > 0 && Math.abs(B[a] - B[idx]) >= 40) w.push('saut de tempo');
      if(w.length) warn = `<div class="small" style="color:var(--warn)">⚠ ${w.join(' · ')}</div>`;
    }

    return `<div class="setlist-item">

        ${warn}
      </div>
    </div>`;
  }).join('');
  return `${rows}
    ${unknown ? `<div class="muted small" style="margin-top:6px">${unknown} morceau${unknown > 1 ? 'x' : ''} sans BPM ni énergie : ${unknown > 1 ? 'placés' : 'placé'} au milieu de la courbe.</div>` : ''}

}

/* ============ À RÉVISER AVANT LA RÉPÈTE ============ */
// Chaque musicien coche ses morceaux dans SA fiche (collection « reviews », une par personne et par répétition) :
// deux personnes qui cochent en même temps ne s'écrasent donc jamais.
const reviewId = (eid, u) => 'rv_' + eid + '_' + u;
function reviewedSongs(eid, u){
  const r = (data.reviews || []).find(x => x.id === reviewId(eid, u));
  return (r && r.songs) || [];
}
function setReviewed(eid, sid, on){
  data.reviews = data.reviews || [];
  const id = reviewId(eid, ui.currentUserId);
  let r = data.reviews.find(x => x.id === id);
  if(!r){ r = {id, eventId:eid, userId:ui.currentUserId, songs:[]}; data.reviews.push(r); }
  const set = new Set(r.songs || []);
  if(on) set.add(sid); else set.delete(sid);
  r.songs = [...set];
  save(); render();
}
function songAudio(sid){
  return songVersions(sid).filter(v => /^https?:\/\//.test(v.url || ''))
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))[0] || null;
}

  return `<div class="small" style="margin-top:2px;color:${done.length === people.length ? 'var(--ok)' : 'var(--muted)'}" title="${esc(names)}">✓ ${done.length}/${people.length} ont révisé</div>`;

function renderGroupStats(g){
  const today = todayISO();
  const songs = songsOf(g.id), evts = eventsOf(g.id), tasks = tasksOf(g.id);
  const past = evts.filter(e=>e.date<today);
  const up = evts.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start||''));

  // Morceaux
  const active = songs.filter(s=>s.status!=='archive');
  const ready = active.filter(s=>s.status==='pret'||s.status==='concert').length;
  const maxS = Math.max(1, ...SONG_STATUSES.map(st=>songs.filter(s=>s.status===st.id).length));

  // Événements
  const d30 = addDays(today,-30);
  const reh30 = past.filter(e=>e.type==='repetition' && e.date>=d30).length;
  const rehUp = up.filter(e=>e.type==='repetition').length;
  const conPast = past.filter(e=>e.type==='concert').length;
  const conUp = up.filter(e=>e.type==='concert');
  const conNoSet = conUp.filter(e=>!(e.setlist||[]).length).length;

  // Disponibilités sur les événements à venir
  const memberIds = g.memberships.map(m=>m.userId);
  const expected = up.length * memberIds.length;
  const answered = up.reduce((n,e)=> n + memberIds.filter(id=>(e.availability||{})[id]).length, 0);

  // Tâches
  const open = tasks.filter(t=>!t.done);
  const late = tasks.filter(t=>taskState(t)==='late');
  const doneN = tasks.length - open.length;
  const unassigned = open.filter(t=>!(t.assignedTo||[]).length).length;
  const perMember = g.memberships.map(m=>{
    const u = user(m.userId); if(!u) return '';
    const mine = open.filter(t=>(t.assignedTo||[]).includes(u.id));
    const l = mine.filter(t=>taskState(t)==='late').length;
    return `<div class="avail-row">
      <div class="avatar" style="background:${u.color};width:28px;height:28px;font-size:12px">${esc(u.initials)}</div>

    </div>`;
  }).join('');

  const next = up[0];
  return `
    <div class="grid cols-3">
      ${statCard('Morceaux prêts', ready+' / '+active.length, active.length ? pct(ready,active.length)+' % du répertoire actif' : 'Aucun morceau')}
            ${statCard('Répétitions faites (30 derniers jours)', reh30, rehUp+' prévue'+(rehUp>1?'s':'')+' à venir')}
      ${statCard('Concerts', conUp.length+' à venir', conPast+' passé'+(conPast>1?'s':''))}
    </div>

        ${next
      ? `<p class="sub" style="margin-top:12px">Prochain événement : ${esc(typeOf(next.type).label)}, ${esc(fmtDate(next.date))} (${esc(fmtRelative(next.date))})</p>`
      : `<p class="sub" style="margin-top:12px">Aucun événement à venir pour ce groupe.</p>`}
    ${conNoSet ? `<p class="small" style="color:var(--warn);margin:4px 0 0">⚠ ${conNoSet} concert${conNoSet>1?'s':''} à venir sans setlist.</p>` : ''}
        ${next ? availSummary(next, true) : ''}

    <h2>Répertoire par statut</h2>
    <div class="card">
      ${songs.length ? SONG_STATUSES.map(st=>statBar(st.label, st.color, songs.filter(s=>s.status===st.id).length, maxS)).join('') : '<div class="muted small">Aucun morceau.</div>'}
    </div>

    <h2>Disponibilités</h2>
    <div class="card">
      ${expected
        ? `<div style="font-size:20px;font-weight:700">${pct(answered,expected)} %</div>
           <div class="sub">de réponses sur les ${up.length} événement${up.length>1?'s':''} à venir (${answered} sur ${expected})</div>`
        : '<div class="muted small">Aucun événement à venir.</div>'}

        <span style="color:${late.length?'var(--danger)':'inherit'}"><strong>${late.length}</strong> <span class="sub">en retard</span></span>

function durSec(v){
  if(v===undefined || v===null || v==='') return 0;
  const t = String(v).trim().replace(/['’]/g,':').replace(',','.');
  if(t.includes(':')){
    const [m,s] = t.split(':');
    return (parseInt(m)||0)*60 + (parseInt(s)||0);
  }
  return Math.round((parseFloat(t)||0)*60);
}
function fmtDur(sec){
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}
function fmtTotal(sec){
  const m = Math.round(sec/60);
  if(m>=60) return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');
  return m+' min';
}
function setlistSummary(e){
  const list = (e.setlist||[]).map(id=>song(id)).filter(Boolean);
  if(!list.length) return '';
  let tot = 0, missing = 0;
  list.forEach(s=>{ const d = durSec(s.duration); if(d) tot += d; else missing++; });
  if(!tot) return `<div class="muted small" style="margin-bottom:10px">⏱ Ajoute la durée des morceaux (bouton « Modifier » du morceau) pour voir le total.</div>`;
  const a = toMin(e.start), b = toMin(e.end);
  const slot = (a!==null && b!==null && b>a) ? (b-a)*60 : 0;
  let cmp = '', color = 'var(--muted)';
  if(e.type==='concert' && slot){
    const diff = slot - tot;
    if(diff >= 0){ color = 'var(--ok)'; cmp = ` · créneau de ${fmtTotal(slot)} : il reste ≈ ${fmtTotal(diff)}`; }
    else { color = 'var(--warn)'; cmp = ` · créneau de ${fmtTotal(slot)} : dépasse de ≈ ${fmtTotal(-diff)}`; }
  }
  return `<div class="small" style="margin-bottom:10px;color:${color}">⏱ Durée totale : ≈ ${fmtTotal(tot)}${missing ? ' ('+missing+' morceau'+(missing>1?'x':'')+' sans durée)' : ''}${cmp}</div>`;
}

function techOf(e){
  if(!e.tech) e.tech = {};
  if(!Array.isArray(e.tech.patch)) e.tech.patch = e.tech.patch ? Object.values(e.tech.patch) : [];
  if(!Array.isArray(e.tech.gear))  e.tech.gear  = e.tech.gear  ? Object.values(e.tech.gear)  : [];
  if(typeof e.tech.stage !== 'string') e.tech.stage = '';
  return e.tech;
}
function ensureTech(e){
  if(!e.tech) e.tech = {};
  e.tech.patch = e.tech.patch || [];
  e.tech.gear = e.tech.gear || [];
  e.tech.stage = e.tech.stage || '';
  return e.tech;
}

const imgCache = {};

const imgUrl = id => sync.db.replace(/\/+$/,'')+'/rooms/'+encodeURIComponent(sync.room)+'/images/'+id+'.json';

function shrinkImage(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onerror = ()=>reject(new Error('lecture impossible'));
    r.onload = ()=>{
      const im = new Image();
      im.onerror = ()=>reject(new Error('format non pris en charge'));
      im.onload = ()=>{
        const k = Math.min(1, 1000/Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height);
        x.drawImage(im,0,0,c.width,c.height);
        let q = 0.72, url = c.toDataURL('image/jpeg', q);
        while(url.length>180000 && q>0.35){ q -= 0.1; url = c.toDataURL('image/jpeg', q); }
        resolve(url);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
async function putImage(id, dataUrl){
  imgCache[id] = dataUrl;
  try{ localStorage.setItem(imgKey(id), dataUrl); }catch(x){}
  if(sync){
    try{
      const r = await fetch(withAuth(imgUrl(id), await tok()), {method:'PUT', body:JSON.stringify(dataUrl)});
      if(!r.ok) console.warn('Image non envoyée à Firebase : statut', r.status);
    }catch(e){
      console.warn('Image non envoyée à Firebase :', e.message);
    }
  }
}
/* ============ SUPABASE STORAGE — UPLOAD AUDIO ============ */

const AUDIO_MAX_MB = 50;
async function uploadAudioToSupabase(file){
  if(!sync) throw new Error('Synchro désactivée.');
  if(file.size > AUDIO_MAX_MB*1024*1024){
    const mo = (file.size/1024/1024).toFixed(1).replace('.',',');
    throw new Error('Fichier trop lourd (' + mo + ' Mo, maximum ' + AUDIO_MAX_MB + ' Mo). Exporte-le en MP3 ou M4A, bien plus légers qu\'un WAV.');
  }
  if(file.type && !/^(audio\/|video\/mp4)/.test(file.type)){
    throw new Error('Ce fichier n\'est pas un fichier audio (' + file.type + '). Formats acceptés : MP3, M4A, WAV, MP4.');
  }
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = sync.room + '/' + Date.now() + '_' + safeName;
  const url = SUPABASE_URL + '/storage/v1/object/audio/' + path;
  const r = await fetch(url, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if(!r.ok){
    const t = await r.text().catch(()=>'');
    throw new Error('Upload refusé (' + r.status + ') ' + t);
  }
  return SUPABASE_URL + '/storage/v1/object/public/audio/' + path;
}

function deleteAudioFromSupabase(url){
  if(!url || !sync) return;
  const m = url.match(/\/object\/public\/audio\/(.+)$/);
  if(!m) return;
  const path = decodeURIComponent(m[1]);
  fetch(SUPABASE_URL + '/storage/v1/object/audio/' + path, {
    method: 'DELETE',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }
  }).catch(()=>{});
}
