  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{

  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{
    font:inherit;color:var(--text);background:var(--panel2);
    border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px;width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:80px}
  input[type=checkbox]{width:auto;flex-shrink:0;accent-color:var(--accent)}

  a{color:var(--accent2);text-decoration:none}
  #root{min-height:100vh;display:flex;flex-direction:column}
  .shell{display:flex;flex:1;min-height:100vh}
  .sidebar{
    width:250px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;flex-shrink:0;
  }
  .brand{padding:18px 18px 14px;font-weight:700;font-size:18px;letter-spacing:.2px;
    display:flex;align-items:center;gap:8px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .nav{padding:6px 8px;display:flex;flex-direction:column;gap:2px}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);
    color:var(--muted);font-weight:500;

  .nav-item.active{background:var(--panel2);color:var(--text)}
  .nav-sep{padding:14px 18px 6px;font-size:11px;text-transform:uppercase;
    letter-spacing:.8px;color:var(--muted);font-weight:600}
  .group-item{
    display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--rs);
    color:var(--muted);font-weight:500;
  }
  .group-item:hover{background:var(--panel2);color:var(--text)}
  .group-item.active{background:var(--panel2);color:var(--text)}
  .group-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .user-box{margin-top:auto;padding:12px;border-top:1px solid var(--border);
    display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    font-weight:700;color:#fff;font-size:13px;flex-shrink:0}
  .user-meta{flex:1;min-width:0}
  .user-meta .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-meta .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:none;padding:12px 16px;border-bottom:1px solid var(--border);
    background:var(--panel);align-items:center;justify-content:space-between;
  }
  .content{padding:24px 28px 60px;max-width:1100px;width:100%;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
  h2{font-size:18px;margin:28px 0 12px;letter-spacing:-.2px}
  h3{font-size:15px;margin:0 0 8px}
  .sub{color:var(--muted);font-size:13px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--rs);
    background:var(--panel2);border:1px solid var(--border);font-weight:500;font-size:14px;
  }
  .btn:hover{border-color:#3a4150}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 10px;font-size:13px}
  .btn.danger{color:var(--danger)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
    padding:16px;margin-bottom:12px;
  }
  .card.clickable{cursor:pointer;transition:border-color .15s}
  .card.clickable:hover{border-color:#3a4150}
  .row{display:flex;align-items:center;gap:10px}
  .row.between{justify-content:space-between}
  .grid{display:grid;gap:12px}
  .grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .grid.cols-3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:720px){

    color:var(--muted);

  .tab{

    white-space:nowrap;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}
  .list{display:flex;flex-direction:column;gap:8px}
  .li{
    display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);
    border:1px solid var(--border);border-radius:var(--rs);

  .li .meta{font-size:12px;color:var(--muted);margin-top:2px}

    .cal-txt{display:none}
    .cal-ev{justify-content:center;padding:3px 0}

  /* ============ SPLASH D'OUVERTURE ============ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse at center, #141826 0%, #07080f 75%);
  display:grid;place-items:center;overflow:hidden;
  animation:splashOut 1s ease-in 4.2s forwards;
  pointer-events:none;
}
#splash.hide{display:none}

.note-wrap{
  position:relative;
  width:180px;height:250px;
  animation:noteGrow 1.45s cubic-bezier(.25,.9,.3,1.15) forwards;
}
.note-wrap .note-svg{
  width:100%;height:100%;
  filter:
    drop-shadow(0 0 22px #4f46e5)
    drop-shadow(0 0 55px #6366f1)
    drop-shadow(0 0 110px rgba(99,102,241,.55));
}
.note-wrap.boom{
  animation:noteBoom .55s cubic-bezier(.5,.05,.6,1) forwards;
}
.note-wrap.soft{animation:noteSoft .9s ease-out forwards}
@keyframes noteSoft{
  0%{transform:scale(1.22);opacity:1}
  100%{transform:scale(1.22);opacity:.25}
}

.instrument{
  position:absolute;top:50%;left:50%;
  font-size:44px;line-height:1;
  opacity:0;
  transform:translate(-50%,-50%) scale(.25);
  animation:fly 2.2s cubic-bezier(.15,.6,.4,1) forwards;
  filter:drop-shadow(0 6px 16px currentColor) drop-shadow(0 0 30px currentColor);
  pointer-events:none;
}

@keyframes noteGrow{
  0%   {transform:scale(.12) rotate(-20deg);opacity:0}
  25%  {transform:scale(.55) rotate(-8deg);opacity:1}
  55%  {transform:scale(.95) rotate(2deg);opacity:1}
  80%  {transform:scale(1.12) rotate(0deg)}
  100% {transform:scale(1.22) rotate(0deg);opacity:1}
}
@keyframes noteBoom{
  0%   {transform:scale(1.22);opacity:1;filter:brightness(1)}
  40%  {transform:scale(1.75);opacity:.85;filter:brightness(2.2)}
  100% {transform:scale(2.8);opacity:0;filter:brightness(3)}
}
@keyframes fly{
  0%   {opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(0deg)}
  12%  {opacity:1}
  55%  {opacity:1}
  100% {opacity:0;
        transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.15) rotate(var(--r,0deg))}
}
@keyframes splashOut{
  to{opacity:0;visibility:hidden}

}

function dedupeUsers(){
  const nkey = n => String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
  const seenId = {}, byName = {}, map = {}, out = [];
  let changed = false;
  data.users.forEach(u=>{
    if(seenId[u.id]){ changed = true; return; }
    seenId[u.id] = true;
    const k = nkey(u.name) || u.id;
    if(byName[k]){
      map[u.id] = byName[k].id; changed = true;
      if(!byName[k].instruments && u.instruments) byName[k].instruments = u.instruments;
    } else { byName[k] = u; out.push(u); }
  });
  const re = id => map[id] || id;
  data.users = out;
  data.groups.forEach(g=>{
    const seen = {}, ms = [];
    (g.memberships||[]).forEach(m=>{
      const id = re(m.userId);
      if(seen[id]){
        changed = true;
        if(m.role==='admin') seen[id].role = 'admin';
        if(!seen[id].instrument && m.instrument) seen[id].instrument = m.instrument;
      } else { const nm = {...m, userId:id}; seen[id] = nm; ms.push(nm); }
    });
    g.memberships = ms;
  });
  if(!Object.keys(map).length) return changed;
  data.tasks.forEach(t=>{
    if(Array.isArray(t.assignedTo)) t.assignedTo = [...new Set(t.assignedTo.map(re))];
  });
  data.events.forEach(e=>{
    const av = e.availability || {};
    for(const old in map){
      if(old in av){ if(!av[map[old]]) av[map[old]] = av[old]; delete av[old]; }
    }
  });
  data.comments.forEach(c=>{ c.userId = re(c.userId); });
  data.songs.forEach(s=>{ if(s.createdBy) s.createdBy = re(s.createdBy); });
  data.songVersions.forEach(v=>{ if(v.createdBy) v.createdBy = re(v.createdBy); });
  Object.keys(data.privateNotes||{}).forEach(k=>{
    const [u,...rest] = k.split(':');
    if(map[u]){
      const nk = map[u]+':'+rest.join(':');
      if(!(nk in data.privateNotes)) data.privateNotes[nk] = data.privateNotes[k];
      delete data.privateNotes[k];
    }
  });
  if(typeof ui!=='undefined' && ui.currentUserId && map[ui.currentUserId]){
    ui.currentUserId = map[ui.currentUserId]; localStorage.setItem(ME_KEY, ui.currentUserId);
  }
  return true;
}

async function syncTick(){
  if(!sync||busy) return;
  busy=true; setStatus('sync');
  try{
    if(dirty){
      const v=ver, cur=snap(data), upd={};
      COLS.forEach(c=>{
        for(const id in cur[c]) if((last[c]||{})[id]!==cur[c][id]) upd[c+'/'+id]=JSON.parse(cur[c][id]);
        for(const id in (last[c]||{})) if(!(id in cur[c])) upd[c+'/'+id]=null;
      });
      if(Object.keys(upd).length){
        const r=await fetch(syncBase()+'.json',{method:'PATCH',body:JSON.stringify(upd)});
        if(!r.ok) throw new Error('push');
      }
      last=cur; if(ver===v) dirty=false;
    } else {
      const r=await fetch(syncBase()+'.json'); if(!r.ok) throw new Error('pull');
      const rem=await r.json();
      if(rem===null){ last={}; dirty=true; setTimeout(syncTick,150); }
      else {
        const before=JSON.stringify(COLS.map(c=>data[c]));
        COLS.forEach(c=>{ data[c]=Object.values(rem[c]||{}); });
               normalize(); last=snap(data);
        if(dedupeUsers()){ dirty=true; ver++; setTimeout(syncTick,150); }
        localStorage.setItem(KEY, JSON.stringify(data));
        if(ui.currentUserId && !user(ui.currentUserId)) ui.currentUserId=null;
               if(!ui.currentUserId) applyPending();
        if(ready && (JSON.stringify(COLS.map(c=>data[c]))!==before || pendingRender)){
          if(idle()){ render(); pendingRender=false; } else pendingRender=true;
        }
      }
    }
    setStatus('ok');
  }catch(e){
    window.syncErr = String((e&&e.message)||e);
    if(!ready) last=snap(data);
    setStatus('off');
  }finally{
    busy=false;
    if(!ready){ ready=true; render(); }
  }
}

function fmtRelative(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const a = new Date(d.getFullYear(),d.getMonth(),d.getDate()), b = new Date(); b.setHours(0,0,0,0);
  const diff = Math.round((a - b)/86400000);
  if(diff === 0) return "aujourd'hui";
  if(diff === 1) return 'demain';
  if(diff === -1) return 'hier';
  if(diff > 1 && diff < 7) return `dans ${diff} jours`;
  if(diff < -1 && diff > -7) return `il y a ${-diff} jours`;
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

function bindLogin(){
  const em = $('#login-email'), pw = $('#login-pass'), go = $('#login-go'), err = $('#login-err');
  const enter = async () => {
    err.textContent = '';
    if(!fbAuth){ err.textContent = 'Firebase Auth non disponible.'; return; }
    if(!em.value.trim() || !pw.value){ err.textContent = 'Email et mot de passe requis.'; return; }
    try{
      go.disabled = true; go.textContent = 'Connexion…';
      await fbAuth.signInWithEmailAndPassword(em.value.trim(), pw.value);
    }catch(e){
      go.disabled = false; go.textContent = 'Se connecter';
      const code = (e && e.code) || '';
      if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) err.textContent = 'Email ou mot de passe incorrect.';
      else if(code.includes('too-many-requests')) err.textContent = 'Trop de tentatives. Réessaie dans quelques minutes.';
      else if(code.includes('invalid-email')) err.textContent = "Format d'email invalide.";
      else err.textContent = 'Erreur : ' + ((e && e.message) || e);
    }
  };
  go.addEventListener('click', enter);
  em.addEventListener('keydown', e => { if(e.key==='Enter') enter(); });
  pw.addEventListener('keydown', e => { if(e.key==='Enter') enter(); });
  const fg = $('#login-forgot');
  if(fg) fg.addEventListener('click', async e => {
    e.preventDefault();

  });

function normStr(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function searchAll(query){
  const q = normStr(query);
  if(q.length < 2) return null;
  const myGids = myGroups().map(g=>g.id);
  const out = { songs:[], events:[], tasks:[], comments:[] };

  // Morceaux
  data.songs.forEach(s=>{
    if(!myGids.includes(s.groupId)) return;
    const fields = [
      {label:'Titre',     value:s.title},
      {label:'Tonalité',  value:s.key},
      {label:'Structure', value:s.structure},
      {label:'Accords',   value:s.chords},
      {label:'Paroles',   value:s.lyrics},
      {label:'Notes',     value:s.notes},
    ];
    Object.values(s.parts||{}).forEach(v=>{
      if(v) fields.push({label:'Partie', value:v});
    });
    const hits = fields.filter(f=>normStr(f.value).includes(q));
    if(hits.length) out.songs.push({item:s, hits});
  });

  // Événements
  data.events.forEach(e=>{
    if(!myGids.includes(e.groupId)) return;
    const fields = [
      {label:'Lieu', value:e.location},
      {label:'Notes', value:e.notes},
    ];
    (e.journal||[]).forEach(n=>{
      if(n.worked) fields.push({label:'Journal ✓', value:n.worked});
      if(n.review) fields.push({label:'Journal ✎', value:n.review});
      if(n.next)   fields.push({label:'Journal →', value:n.next});
    });
    const hits = fields.filter(f=>normStr(f.value).includes(q));
    if(hits.length) out.events.push({item:e, hits});
  });

  // Tâches
  data.tasks.forEach(t=>{
    if(!myGids.includes(t.groupId)) return;
    if(normStr(t.title).includes(q)) out.tasks.push({item:t, hits:[{label:'Titre', value:t.title}]});
  });

  // Commentaires
  data.comments.forEach(c=>{
    if(!normStr(c.text).includes(q)) return;
    let target = null;
    if(c.targetType==='song'){
      const s = song(c.targetId);
      if(s && myGids.includes(s.groupId)) target = {type:'song', item:s};
    } else if(c.targetType==='event'){
      const ev = event(c.targetId);
      if(ev && myGids.includes(ev.groupId)) target = {type:'event', item:ev};
    }
    if(target) out.comments.push({item:c, target, hits:[{label:'Commentaire', value:c.text}]});
  });

  return out;
}

function snip(text, query){
  const s = String(text||'');
  const n = normStr(s), q = normStr(query);
  const i = n.indexOf(q);
  if(i < 0) return esc(s.slice(0,120));
  const start = Math.max(0, i-40);
  const end   = Math.min(s.length, i+q.length+80);
  const before = s.slice(start, i);
  const mid    = s.slice(i, i+q.length);
  const after  = s.slice(i+q.length, end);
  return (start>0?'…':'') + esc(before)
    + '<mark style="background:var(--accent);color:#fff;padding:0 2px;border-radius:3px">' + esc(mid) + '</mark>'
    + esc(after) + (end<s.length?'…':'');
}

function toMin(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}
function eventRange(e){
  const s = toMin(e.start); if(s===null) return null;
  let en = toMin(e.end);
  if(en===null || en<=s) en = s+120; // sans heure de fin : on compte 2 h
  return [s,en];
}
function conflictsFor(e){
  const r = eventRange(e); if(!r) return [];
  const g = group(e.groupId); if(!g) return [];
  const ids = g.memberships.map(m=>m.userId);
  return data.events.filter(x=>{
    if(x.id===e.id || x.date!==e.date) return false;
        if(!myGroups().some(mg=>mg.id===x.groupId)) return false;
    const r2 = eventRange(x); if(!r2) return false;
    if(!(r[0]<r2[1] && r2[0]<r[1])) return false;
    const g2 = group(x.groupId); if(!g2) return false;
    return g2.memberships.some(m=>ids.includes(m.userId));
  });
}
function conflictLabel(e,x){
  const g1 = group(e.groupId), g2 = group(x.groupId);
  const ids1 = g1.memberships.map(m=>m.userId);
  const shared = g2.memberships.filter(m=>ids1.includes(m.userId))
    .map(m=>user(m.userId)?.name).filter(Boolean);
  return g2.name+' — '+typeOf(x.type).label+' ('+(x.start||'')+(x.end?'–'+x.end:'')+') · '+shared.join(', ');
}
function conflictBanner(e){
  if(e.date<todayISO()) return '';
  const c = conflictsFor(e); if(!c.length) return '';
  return `<div class="small" style="color:var(--warn);margin-top:8px">⚠ Conflit d'agenda : ${c.map(x=>esc(conflictLabel(e,x))).join(' | ')}</div>`;
}
function availSummary(e, detail){
  const g = group(e.groupId); if(!g) return '';
  const av = e.availability || {};
  let oui=0, peut=0, non=0;
  const waiting = [];
  g.memberships.forEach(m=>{
    const v = av[m.userId];
    if(v==='oui') oui++;
    else if(v==='peut') peut++;
    else if(v==='non') non++;
    else { const u = user(m.userId); if(u) waiting.push(u.name); }
  });
  const parts = [];
  if(oui)  parts.push(`<span style="color:var(--ok)">✓ ${oui} oui</span>`);
  if(peut) parts.push(`<span style="color:var(--warn)">? ${peut} peut-être</span>`);
  if(non)  parts.push(`<span style="color:var(--danger)">✗ ${non} non</span>`);
  if(waiting.length){
    parts.push(`<span class="muted">${oui+peut+non ? waiting.length+' sans réponse' : 'Aucune réponse'}${detail ? ' : '+waiting.map(esc).join(', ') : ''}</span>`);
  }
  if(!parts.length) return '';
  return `<div class="small" style="margin:${detail?'0 0 10px':'8px 0 0'};display:flex;gap:12px;flex-wrap:wrap">${parts.join('')}</div>`;
}
function renderEventCard(e, past){

}

  `;

function cmpDue(a,b){
  if(!a.due && !b.due) return 0;
  if(!a.due) return 1;
  if(!b.due) return -1;
  return a.due.localeCompare(b.due);
}
function taskState(t){
  if(t.done || !t.due) return '';
  const today = todayISO();
  if(t.due < today) return 'late';
  if(t.due === today) return 'today';
  return '';
}
function dueHtml(t){
  const st = taskState(t), d = esc(fmtDateShort(t.due));
  if(st==='late')  return `<span style="color:var(--danger);font-weight:600">⚠ en retard · ${d}</span>`;
  if(st==='today') return `<span style="color:var(--warn);font-weight:600">aujourd'hui</span>`;
  return d;
}
function renderTaskRow(t){
  const assignees = (t.assignedTo||[]).map(id=>user(id)).filter(Boolean);
  const late = taskState(t)==='late';
  return `<div class="li" style="${late?'border-left:3px solid var(--danger)':''}">

  </div>`;
}

function renderGroupStats(g){
  const today = todayISO();
  const songs = songsOf(g.id), evts = eventsOf(g.id), tasks = tasksOf(g.id);
  const past = evts.filter(e=>e.date<today);
  const up = evts.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)||(a.start||'').localeCompare(b.start||''));

  // Morceaux
  const active = songs.filter(s=>s.status!=='archive');
  const ready = active.filter(s=>s.status==='pret'||s.status==='concert').length;
  const maxS = Math.max(1, ...SONG_STATUSES.map(st=>songs.filter(s=>s.status===st.id).length));

  // Événements
  const d30 = addDays(today,-30);
  const reh30 = past.filter(e=>e.type==='repetition' && e.date>=d30).length;
  const rehUp = up.filter(e=>e.type==='repetition').length;
  const conPast = past.filter(e=>e.type==='concert').length;
  const conUp = up.filter(e=>e.type==='concert');
  const conNoSet = conUp.filter(e=>!(e.setlist||[]).length).length;

  // Disponibilités sur les événements à venir
  const memberIds = g.memberships.map(m=>m.userId);
  const expected = up.length * memberIds.length;
  const answered = up.reduce((n,e)=> n + memberIds.filter(id=>(e.availability||{})[id]).length, 0);

  // Tâches
  const open = tasks.filter(t=>!t.done);
  const late = tasks.filter(t=>taskState(t)==='late');
  const doneN = tasks.length - open.length;
  const unassigned = open.filter(t=>!(t.assignedTo||[]).length).length;
  const perMember = g.memberships.map(m=>{
    const u = user(m.userId); if(!u) return '';
    const mine = open.filter(t=>(t.assignedTo||[]).includes(u.id));

function durSec(v){
  if(v===undefined || v===null || v==='') return 0;
  const t = String(v).trim().replace(/['’]/g,':').replace(',','.');
  if(t.includes(':')){
    const [m,s] = t.split(':');
    return (parseInt(m)||0)*60 + (parseInt(s)||0);
  }
  return Math.round((parseFloat(t)||0)*60);
}
function fmtDur(sec){
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}
function fmtTotal(sec){
  const m = Math.round(sec/60);
  if(m>=60) return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');
  return m+' min';
}
function setlistSummary(e){
  const list = (e.setlist||[]).map(id=>song(id)).filter(Boolean);
  if(!list.length) return '';
  let tot = 0, missing = 0;
  list.forEach(s=>{ const d = durSec(s.duration); if(d) tot += d; else missing++; });
  if(!tot) return `<div class="muted small" style="margin-bottom:10px">⏱ Ajoute la durée des morceaux (bouton « Modifier » du morceau) pour voir le total.</div>`;
  const a = toMin(e.start), b = toMin(e.end);
  const slot = (a!==null && b!==null && b>a) ? (b-a)*60 : 0;
  let cmp = '', color = 'var(--muted)';
  if(e.type==='concert' && slot){
    const diff = slot - tot;
    if(diff >= 0){ color = 'var(--ok)'; cmp = ` · créneau de ${fmtTotal(slot)} : il reste ≈ ${fmtTotal(diff)}`; }
    else { color = 'var(--warn)'; cmp = ` · créneau de ${fmtTotal(slot)} : dépasse de ≈ ${fmtTotal(-diff)}`; }
  }
  return `<div class="small" style="margin-bottom:10px;color:${color}">⏱ Durée totale : ≈ ${fmtTotal(tot)}${missing ? ' ('+missing+' morceau'+(missing>1?'x':'')+' sans durée)' : ''}${cmp}</div>`;
}

function techOf(e){ return e.tech || {patch:[],stage:'',gear:[]}; }
function ensureTech(e){

  e.tech.patch = e.tech.patch || [];

  e.tech.stage = e.tech.stage || '';

function techText(e){
  const g = group(e.groupId), t = techOf(e), ty = typeOf(e.type);
  const L = [g.name+' — '+ty.label, fmtDate(e.date)+' · '+(e.start||'')+(e.end?'–'+e.end:'')+(e.location?' · '+e.location:'')];
  if(t.patch.length){
    L.push('', 'PATCH LIST');
    t.patch.forEach(p=>L.push(p.ch+'. '+p.src+(p.mic?' — '+p.mic:'')+(p.note?' ('+p.note+')':'')));
  }
  if(t.stage){ L.push('', 'PLAN DE SCÈNE', t.stage); }
  if(t.gear.length){
    L.push('', 'MATÉRIEL');
    t.gear.forEach(x=>{ const u = x.who ? user(x.who) : null; L.push('- '+x.t+(u?' ('+u.name+')':'')); });
  }
  return L.join('\n');
}

const imgCache = {};
const imgKey = id => 'pupitre-img-'+id;
const imgUrl = id => sync.db.replace(/\/+$/,'')+'/rooms/'+encodeURIComponent(sync.room)+'/images/'+id+'.json';

function shrinkImage(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onerror = ()=>reject(new Error('lecture impossible'));
    r.onload = ()=>{
      const im = new Image();
      im.onerror = ()=>reject(new Error('format non pris en charge'));
      im.onload = ()=>{
        const k = Math.min(1, 1000/Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height);
        x.drawImage(im,0,0,c.width,c.height);
        let q = 0.72, url = c.toDataURL('image/jpeg', q);
        while(url.length>180000 && q>0.35){ q -= 0.1; url = c.toDataURL('image/jpeg', q); }
        resolve(url);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
async function putImage(id, dataUrl){
  imgCache[id] = dataUrl;
  try{ localStorage.setItem(imgKey(id), dataUrl); }catch(x){}
  if(sync){
    try{
      const r = await fetch(imgUrl(id), {method:'PUT', body:JSON.stringify(dataUrl)});
      if(!r.ok) console.warn('Image non envoyée à Firebase : statut', r.status);
    }catch(e){
      console.warn('Image non envoyée à Firebase :', e.message);
    }
  }
}
/* ============ SUPABASE STORAGE — UPLOAD AUDIO ============ */

async function uploadAudioToSupabase(file){
  if(!sync) throw new Error('Synchro désactivée.');
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = sync.room + '/' + Date.now() + '_' + safeName;
  const url = SUPABASE_URL + '/storage/v1/object/audio/' + path;
  const r = await fetch(url, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if(!r.ok){
    const t = await r.text().catch(()=>'');
    throw new Error('Upload refusé (' + r.status + ') ' + t);
  }
  return SUPABASE_URL + '/storage/v1/object/public/audio/' + path;
}

function deleteAudioFromSupabase(url){
  if(!url || !sync) return;
  const m = url.match(/\/object\/public\/audio\/(.+)$/);
  if(!m) return;
  const path = decodeURIComponent(m[1]);
  fetch(SUPABASE_URL + '/storage/v1/object/audio/' + path, {
    method: 'DELETE',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }
  }).catch(()=>{});
}
async function getImage(id){
  if(imgCache[id]) return imgCache[id];
  try{ const v = localStorage.getItem(imgKey(id)); if(v){ imgCache[id] = v; return v; } }catch(x){}
  if(sync){
    try{
      const r = await fetch(imgUrl(id));
      if(r.ok){
        const v = await r.json();
        if(v){ imgCache[id] = v; try{ localStorage.setItem(imgKey(id), v); }catch(x){} return v; }
      }
    }catch(x){}
  }
  return null;
}
function deleteImage(id){
  delete imgCache[id];
  try{ localStorage.removeItem(imgKey(id)); }catch(x){}
  if(sync) fetch(imgUrl(id), {method:'DELETE'}).catch(()=>{});
}

let stage = null, wakeLock = null;
async function keepAwake(on){
  try{
    if(on){ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }
    else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(x){}
}
let metro = null;

function metroBpmFor(s){
  return (s && s.bpm && +s.bpm > 0) ? +s.bpm : 100;
}

function metroInit(){
  if(metro) return metro.ac;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  metro = { ac:new AC(), bpm:100, count:0, playing:false, timer:null };
  return metro.ac;
}

function metroBeep(fort){
  if(!metro || !metro.ac) return;
  const ac = metro.ac;
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = 'square';
  o.frequency.value = fort ? 1400 : 900;
  o.connect(g); g.connect(ac.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(fort ? 0.22 : 0.13, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.start(t);
  o.stop(t + 0.07);
}

function metroTick(){
  if(!metro || !metro.playing) return;
  metroBeep(metro.count % 4 === 0);
  metro.count++;
  metro.timer = setTimeout(metroTick, 60000 / metro.bpm);
}

function metroStart(){
  const ac = metroInit();
  if(!ac){ alert("Audio non disponible sur cet appareil."); return; }
  if(ac.state === 'suspended') ac.resume();
  const s = stage ? song(stage.ids[stage.i]) : null;
  metro.bpm = metroBpmFor(s);
  metro.count = 0;
  metro.playing = true;
  metroTick();
  drawStage(true);
}

function metroStop(){
  if(!metro) return;
  metro.playing = false;
  clearTimeout(metro.timer);
  drawStage(true);
}

function metroToggle(){
  if(!metro || !metro.playing) metroStart();
  else metroStop();
}

function metroBpmChange(d){
  if(!metro) return;
  metro.bpm = Math.max(40, Math.min(240, metro.bpm + d));
  drawStage(true);
}
function openStage(eid){
  const e = event(eid); if(!e) return;
  const ids = (e.setlist||[]).filter(id=>song(id));
  if(!ids.length){ alert('La setlist est vide.'); return; }
  let size = 22;
  try{ size = +localStorage.getItem('pupitre-stage-size') || 22; }catch(x){}
  stage = {eid, ids, i:0, size};
  keepAwake(true);
  drawStage();
}
function closeStage(){
  if(metro && metro.playing){
    metro.playing = false;
    clearTimeout(metro.timer);
  }
  stage = null; keepAwake(false); drawStage(); }
function stageGo(n){
  if(!stage) return;
  const i = stage.i + n;
  if(i<0 || i>=stage.ids.length) return;
  stage.i = i;
  if(metro && metro.playing){
    metro.bpm = metroBpmFor(song(stage.ids[stage.i]));
  }
  drawStage();
}
function stageSize(d){
  if(!stage) return;
  stage.size = Math.max(14, Math.min(56, stage.size + d));
  try{ localStorage.setItem('pupitre-stage-size', stage.size); }catch(x){}
  drawStage(true);
}
function drawStage(keepScroll){

      if(x0===null) return;
      const dx = ev.changedTouches[0].clientX - x0, dy = ev.changedTouches[0].clientY - y0;

      if(Math.abs(dx) > 90 && Math.abs(dy) < 60) stageGo(dx<0 ? 1 : -1);

      <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #2a2f3a">
        <button onclick="closeStage()" ${bt}>✕</button>
<button onclick="metroToggle()" ${bt} style="background:${metro && metro.playing ? '#6366f1' : '#171a21'};border-color:${metro && metro.playing ? '#6366f1' : '#2a2f3a'}">🥁${metro && metro.playing ? ' ' + metro.bpm : ''}</button>
${metro && metro.playing ? `
  <button onclick="metroBpmChange(-2)" ${bt} style="padding:12px 14px">−</button>
  <button onclick="metroBpmChange(2)" ${bt} style="padding:12px 14px">+</button>
` : ''}
<div style="flex:1;text-align:center;color:#8b93a7">${stage.i+1} / ${n}</div>
        <button onclick="stageSize(-2)" ${bt}>A−</button>
        <button onclick="stageSize(2)" ${bt}>A+</button>
      </div>
      <div id="stage-body" style="flex:1;overflow:auto;padding:18px 22px">
        <div style="font-size:${Math.round(z*1.9)}px;font-weight:700;line-height:1.15">${esc(s.title)}</div>
        <div style="margin-top:8px;font-size:${Math.round(z*0.95)}px;color:#a5b4fc">${s.key?esc(s.key):''}${s.key&&s.bpm?' · ':''}${s.bpm?s.bpm+' BPM':''}</div>
        ${block('Structure', s.structure, false)}

        ${s.notes ? `<div style="margin-top:${Math.round(z*0.9)}px;font-size:${Math.round(z*0.85)}px;color:#f59e0b;white-space:pre-wrap">📝 ${esc(s.notes)}</div>` : ''}
                ${stagePartsHtml(s, z)}

        <button onclick="stageGo(1)" ${bt} ${stage.i===n-1?'disabled':''}>Suivant →</button>

document.addEventListener('keydown', ev=>{

  if(ev.key==='ArrowRight') stageGo(1);

});

function toAudioUrl(url){
  if(!url) return '';
  let u = String(url).trim();
  // Google Drive : file/d/ID/view  ou  open?id=ID
  let m = u.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/uc?export=download&id=' + m[1];
  m = u.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/uc?export=download&id=' + m[1];
  // Dropbox : dl=0 → dl=1
  if(/dropbox\.com/.test(u)){
    u = u.replace(/[?&]dl=0/, s=>s.charAt(0)+'dl=1').replace(/[?&]raw=0/, s=>s.charAt(0)+'raw=1');
    if(!/[?&](dl=1|raw=1)/.test(u)) u += (u.includes('?') ? '&raw=1' : '?raw=1');
  }
  return u;
}

let miniPlayer = null;

function fmtTime(t){
  if(!isFinite(t) || t < 0) return '0:00';
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return m + ':' + String(s).padStart(2,'0');
}

async function playAudio(songId, versionId){
  const s = song(songId);
  if(!s) return;
  const v = data.songVersions.find(x => x.id === versionId);
  if(!v) return;
  const url = toAudioUrl(v.url);
  if(!url){ alert('Aucun lien audio pour cette version.'); return; }
  closeMiniPlayer();

  const el = document.createElement('div');
  el.id = 'mini-player';
  el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:250;background:#171a21;border-top:1px solid #2a2f3a;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;box-shadow:0 -4px 12px rgba(0,0,0,.35)';

  const audio = document.createElement('audio');
  audio.preload = 'metadata';
  audio.style.cssText = 'display:none';
  document.body.appendChild(audio);

  const btn = 'background:#1e222b;border:1px solid #2a2f3a;border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0';
  el.innerHTML = `
    <button data-pp style="${btn};min-width:44px">⏳</button>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
        ${esc(s.title)} <span style="color:#8b93a7;font-weight:400">· ${esc(v.label)}</span>
      </div>
      <input type="range" data-seek min="0" max="1000" value="0" style="width:100%;margin:6px 0 0;padding:0;height:20px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#8b93a7">
        <span data-cur>0:00</span><span data-dur>0:00</span>
      </div>
    </div>
    <button data-close style="${btn}">✕</button>
  `;
  document.body.appendChild(el);
  miniPlayer = {el, audio};

  const pp   = el.querySelector('[data-pp]');
  const seek = el.querySelector('[data-seek]');
  const cur  = el.querySelector('[data-cur]');
  const dur  = el.querySelector('[data-dur]');

  // Téléchargement complet du fichier puis lecture depuis un blob local
  let blobUrl = null;
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    blobUrl = URL.createObjectURL(blob);
    audio.src = blobUrl;
    pp.textContent = '▶';
  }catch(e){
    console.warn('Lecture directe impossible, on tente en streaming :', e.message);
    audio.src = url;
    pp.textContent = '▶';
  }

  pp.onclick = () => {
    if(audio.paused){ audio.play().catch(err=>alert('Lecture impossible : ' + err.message)); }
    else audio.pause();
  };
  audio.onplay  = () => { pp.textContent = '⏸'; };
  audio.onpause = () => { pp.textContent = '▶'; };
  audio.onloadedmetadata = () => { dur.textContent = fmtTime(audio.duration); };
  audio.ontimeupdate = () => {
    cur.textContent = fmtTime(audio.currentTime);
    if(audio.duration && isFinite(audio.duration)){
      seek.value = Math.round(audio.currentTime / audio.duration * 1000);
    }
  };
  audio.onerror = () => { dur.textContent = 'erreur'; };
  seek.oninput = () => {
    if(audio.duration && isFinite(audio.duration)){
      audio.currentTime = seek.value / 1000 * audio.duration;
    }
  };
  el.querySelector('[data-close]').onclick = () => {
    if(blobUrl) URL.revokeObjectURL(blobUrl);
    closeMiniPlayer();
  };

  // Si on a une URL blob, elle est locale, donc play() marche tout de suite
  if(audio.src && audio.src.startsWith('blob:')){
    audio.play().catch(err => console.warn('Lecture auto bloquée :', err.message));
  }
}

function closeMiniPlayer(){
  if(!miniPlayer) return;
  try{ miniPlayer.audio.pause(); }catch(e){}
  if(miniPlayer.blobUrl){
    try{ URL.revokeObjectURL(miniPlayer.blobUrl); }catch(e){}
  }
  try{ miniPlayer.el.remove(); }catch(e){}
  miniPlayer = null;
}
function deleteUser(id){
  const u = user(id); if(!u) return;
  if(id === ui.currentUserId){ alert('Tu ne peux pas supprimer ton propre profil.'); return; }
  const soleAdmin = data.groups.find(g =>
    g.memberships.some(m=>m.userId===id && m.role==='admin') &&
    g.memberships.filter(m=>m.role==='admin').length<=1);
  if(soleAdmin){ alert('« '+u.name+' » est le seul admin de « '+soleAdmin.name+' ». Passe un autre membre admin d\'abord.'); return; }
  if(!confirm('Supprimer définitivement « '+u.name+' » ?\n\nIl sera retiré de tous les groupes et de l\'écran de connexion.')) return;
  data.groups.forEach(g=>{ g.memberships = g.memberships.filter(m=>m.userId!==id); });
  data.tasks.forEach(t=>{ if(Array.isArray(t.assignedTo)) t.assignedTo = t.assignedTo.filter(x=>x!==id); });
  data.events.forEach(e=>{ if(e.availability) delete e.availability[id]; });
  Object.keys(data.privateNotes).forEach(k=>{ if(k.startsWith(id+':')) delete data.privateNotes[k]; });
  data.users = data.users.filter(x=>x.id!==id);
  save(); render();
}

function addDays(iso,n){
  const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function openRecurModal(gid){
  const g=group(gid);
  const days=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  openModal({
    title:'Répétitions récurrentes',
    submitLabel:'Créer',
    body:`
      <div class="field-row">
        <div class="field"><label>Jour</label>
          <select name="day">${days.map((d,i)=>`<option value="${i}" ${i===4?'selected':''}>${d}</option>`).join('')}</select></div>
        <div class="field"><label>Fréquence</label>
          <select name="every"><option value="1">Chaque semaine</option><option value="2">Toutes les 2 semaines</option><option value="4">Toutes les 4 semaines</option></select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Début</label><input type="time" name="start" value="18:00" required></div>
        <div class="field"><label>Fin</label><input type="time" name="end" value="21:00"></div>
      </div>
           <div class="field"><label>Lieu</label><input name="location" list="loc-list" autocomplete="off" value="${esc(g.locations[0]||'')}">${locDatalist(gid)}</div>
      <div class="field-row">
        <div class="field"><label>À partir du</label><input type="date" name="from" value="${todayISO()}" required></div>
        <div class="field"><label>Jusqu'au</label><input type="date" name="to" value="${addDays(todayISO(),90)}" required></div>
      </div>
      <p class="sub" style="margin:0">Les dates où une répétition existe déjà ne sont pas dupliquées.</p>`,
    onSubmit: fd=>{
            learnLocation(gid, fd.location);
      const step=+fd.every*7;
      let d=fd.from, created=0, guard=0;
      while(new Date(d+'T00:00:00').getDay()!==+fd.day && guard++<7) d=addDays(d,1);
      guard=0;
      while(d<=fd.to && guard++<60){
        if(!eventsOf(gid).some(e=>e.type==='repetition' && e.date===d)){
          data.events.push({id:uid('e'),groupId:gid,type:'repetition',date:d,
            start:fd.start,end:fd.end,location:fd.location,notes:'',
            checklist:[],availability:{},setlist:[]});
          created++;
        }
        d=addDays(d,step);
      }
      save(); render();
      alert(created+' répétition(s) créée(s).');
    }
  });
}

function closeModal(){ $('#modal-root').innerHTML=''; }
function openModal({title, body, onSubmit, submitLabel='Enregistrer'}){
  const root = $('#modal-root');
  root.innerHTML = `
    <div class="modal-back" data-close-modal>
      <form class="modal" id="modal-form">
        <div class="modal-header">
          <h2>${esc(title)}</h2>
          <button type="button" class="btn ghost sm" data-close-modal>✕</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-footer">
          <button type="button" class="btn ghost" data-close-modal>Annuler</button>
          <button type="submit" class="btn primary">${esc(submitLabel)}</button>
        </div>
      </form>
    </div>`;
  $$('[data-close-modal]').forEach(el=>el.addEventListener('click', e=>{
    if(e.target.classList.contains('modal-back') || el.tagName==='BUTTON') closeModal();
  }));
  $('#modal-form').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const obj = Object.fromEntries(fd.entries());
    onSubmit(obj);
    closeModal();
  });
  const first = $('#modal-form input, #modal-form select, #modal-form textarea');
  if(first) setTimeout(()=>first.focus(),50);
}

function parseLocs(txt){
  const seen = {};
  return String(txt||'').split('\n').map(x=>x.trim()).filter(x=>{
    const k = x.toLowerCase();
    if(!x || seen[k]) return false;
    seen[k] = 1; return true;
  });
}
function locDatalist(gid){
  const g = group(gid);
  return `<datalist id="loc-list">${((g&&g.locations)||[]).map(l=>`<option value="${esc(l)}"></option>`).join('')}</datalist>`;
}
function learnLocation(gid, loc){
  const g = group(gid), l = (loc||'').trim();
  if(!g || !l) return;
  g.locations = g.locations || [];
  if(!g.locations.some(x=>x.toLowerCase()===l.toLowerCase())) g.locations.push(l);
}

function icsEsc(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function icsFold(line){
  const out = []; let l = line;
  while(l.length>60){ out.push(l.slice(0,60)); l = ' '+l.slice(60); }
  out.push(l);
  return out.join('\r\n');
}
function icsStamp(iso, min){
  let d = iso;
  while(min>=1440){ d = addDays(d,1); min -= 1440; }
  return d.replace(/-/g,'')+'T'+String(Math.floor(min/60)).padStart(2,'0')+String(min%60).padStart(2,'0')+'00';
}
function icsBuild(list){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pupitre//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Pupitre'];
  list.forEach(e=>{
    const g = group(e.groupId); if(!g) return;
    const t = typeOf(e.type);
    const s = toMin(e.start);
    L.push('BEGIN:VEVENT','UID:'+e.id+'@pupitre','DTSTAMP:'+stamp);
    if(s===null){
      L.push('DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''), 'DTEND;VALUE=DATE:'+addDays(e.date,1).replace(/-/g,''));
    } else {
      let en = toMin(e.end);
      if(en===null) en = s+120; else if(en<=s) en += 1440;
      L.push('DTSTART:'+icsStamp(e.date,s), 'DTEND:'+icsStamp(e.date,en));
    }
    L.push(icsFold('SUMMARY:'+icsEsc(g.name+' — '+t.label)));
    if(e.location) L.push(icsFold('LOCATION:'+icsEsc(e.location)));
    const desc = [];
    if(e.notes) desc.push(e.notes);
    const sl = (e.setlist||[]).map(id=>song(id)).filter(Boolean).map(x=>x.title);
    if(sl.length) desc.push((e.type==='repetition' ? 'À travailler : ' : 'Setlist : ')+sl.join(', '));
    if(desc.length) L.push(icsFold('DESCRIPTION:'+icsEsc(desc.join('\n'))));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}
function shareIcs(){
  const ics = window._pupIcs || '';
  const file = new File([ics], 'pupitre-agenda.ics', {type:'text/calendar'});
  if(!navigator.share || !(navigator.canShare && navigator.canShare({files:[file]}))){
    alert("Partage indisponible ici. Utilise le lien « Ouvrir dans l'agenda »."); return;
  }
  navigator.share({files:[file]}).catch(e=>{
    if(e && e.name!=='AbortError') alert('Partage impossible : '+(e.message||e));
  });
}

function personalLink(u){
  return location.origin+location.pathname+'#me='+encodeURIComponent(u.id)+(u.pin?'&pin='+encodeURIComponent(u.pin):'')+'&room='+encodeURIComponent(sync.room)+'&db='+encodeURIComponent(sync.db);
}
function qrSvg(text){
  if(typeof qrcode==='undefined') return null;
  const qr = qrcode(0,'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), m = 4, size = n+2*m;
  let d = '';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) d += 'M'+(c+m)+' '+(r+m)+'h1v1h-1z';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" style="width:100%;max-width:340px;background:#fff;border-radius:8px"><path d="${d}" fill="#000"/></svg>`;
}
function openQrModal(uid_){
  const u = user(uid_); if(!u) return;
  if(!sync){ alert("Active d'abord la synchro (menu Synchro)."); return; }
  if(!u.pin){ alert('Définis d\'abord le code de '+u.name+' (bouton Code).'); return; }
  let svg = null;
  try{ svg = qrSvg(personalLink(u)); }catch(e){}
  openModal({
    title:'QR code de '+u.name,
    submitLabel:'Fermer',
    body: svg
      ? `<p class="sub" style="margin:0">${esc(u.name)} scanne ce code avec l'appareil photo de son téléphone : il arrive directement dans son espace.</p>
         <div style="display:grid;place-items:center">${svg}</div>
         <p class="sub" style="margin:0">Montre-le uniquement à ${esc(u.name)} : il donne accès à son espace. Monte la luminosité de l'écran si le scan hésite.</p>`
      : `<p class="sub" style="margin:0">QR code indisponible : la bibliothèque n'a pas pu se charger (il faut une connexion internet). Utilise « Inviter » ou « Lien ».</p>`,
    onSubmit: ()=>{}
  });
}

/* ============ AUTH STATE ============ */
function matchEmailToUser(email){
  if(!email) return null;
  const k = email.toLowerCase();
  return data.users.find(u => (u.email||'').toLowerCase() === k) || null;
}

if(fbAuth){
  // Attendre que setPersistence soit terminé avant d'écouter l'état
  Promise.resolve(fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL))
    .catch(()=>{})
    .then(() => {
  fbAuth.onAuthStateChanged(u => {
    fbUser = u;
    if(!u){
      ui.currentUserId = null;
      localStorage.removeItem(ME_KEY);
      localStorage.removeItem('pupitre-pending-email');
    } else {
      const email = (u.email||'').toLowerCase();
      const match = matchEmailToUser(email);
      if(match){
        ui.currentUserId = match.id;
        localStorage.setItem(ME_KEY, match.id);
        localStorage.removeItem('pupitre-pending-email');
      } else {
        ui.currentUserId = null;
        localStorage.removeItem(ME_KEY);
        localStorage.setItem('pupitre-pending-email', email);
      }
    }
       render();
    if(sync && fbUser) syncTick();
  });
    });
}

/* ============ SON DU SPLASH (synthé électro) ============ */
function splashPlaySound(ac){
  const t0 = ac.currentTime + 0.02;

  const master = ac.createGain();
  master.gain.value = 0.34;
  master.connect(ac.destination);

  // Bus de réverbe court, filtré pour éviter les aigus cristallins
  const rev = ac.createConvolver();
  const len = ac.sampleRate * 1.4;
  const ir = ac.createBuffer(2, len, ac.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = ir.getChannelData(ch);
    for(let i=0; i<len; i++){
      d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3.2);
    }
  }
  rev.buffer = ir;

  const revFilt = ac.createBiquadFilter();
  revFilt.type = 'lowpass';
  revFilt.frequency.value = 1400;
  revFilt.Q.value = 0.7;

  const revGain = ac.createGain();
  revGain.gain.value = 0.18;
  rev.connect(revFilt);
  revFilt.connect(revGain);
  revGain.connect(master);

  /* 1. NAPPE SAW DÉTUNÉE (0 → 2s) */
  {
    const freqs = [110, 165, 220];
    const filt = ac.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(320, t0);
    filt.frequency.exponentialRampToValueAtTime(2200, t0 + 1.9);
    filt.Q.value = 9;

    freqs.forEach((f, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sawtooth';
      o.frequency.value = f * (1 + (i - 1) * 0.006);
      o.connect(g); g.connect(filt);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.045, t0 + 0.8);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.15);
      o.start(t0); o.stop(t0 + 2.2);
    });

    filt.connect(master);
    filt.connect(rev);
  }

  /* 2. RISER SAW RÉSONANT (0.4 → 2s) */
  {
    const o = ac.createOscillator();
    const g = ac.createGain();
    const filt = ac.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(180, t0 + 0.4);
    o.frequency.exponentialRampToValueAtTime(580, t0 + 2.0);
    filt.type = 'bandpass';
    filt.frequency.setValueAtTime(500, t0 + 0.4);
    filt.frequency.exponentialRampToValueAtTime(3200, t0 + 2.0);
    filt.Q.value = 14;
    o.connect(filt); filt.connect(g); g.connect(master);

    g.gain.setValueAtTime(0.0001, t0 + 0.4);
    g.gain.exponentialRampToValueAtTime(0.075, t0 + 1.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.05);
    o.start(t0 + 0.4); o.stop(t0 + 2.1);
  }

  /* 3. SUB BASS (0 → 2.1s) */
  {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(55, t0);
    o.frequency.exponentialRampToValueAtTime(82, t0 + 1.9);
    o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.20, t0 + 1.0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.15);
    o.start(t0); o.stop(t0 + 2.2);
  }

  /* 4. EXPLOSION SYNTH (2.0s) — kick + stab d'accord */
  {
    const tb = t0 + 2.0;

    // Kick synthé : sinus 130 → 42 Hz
    {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(130, tb);
      o.frequency.exponentialRampToValueAtTime(42, tb + 0.22);
      o.connect(g); g.connect(master);
      g.gain.setValueAtTime(0.0001, tb);
      g.gain.exponentialRampToValueAtTime(0.55, tb + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, tb + 0.35);
      o.start(tb); o.stop(tb + 0.4);
    }

    // Stab d'accord : 4 voix triangle douces, filtre qui se referme
    const notes = [261.63, 392.00, 523.25, 783.99];
    const filt = ac.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(2400, tb);
    filt.frequency.exponentialRampToValueAtTime(700, tb + 1.5);
    filt.Q.value = 2.5;
    filt.connect(master);
    filt.connect(rev);

    notes.forEach((f, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      o.connect(g); g.connect(filt);
      const t = tb + i * 0.015;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.10, t + 0.045);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
      o.start(t); o.stop(t + 1.8);
    });
  }
}

function playSplashSound(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ac = new AC();
    if(ac.state === 'suspended'){
      const unlock = () => {
        ac.resume().then(()=>splashPlaySound(ac)).catch(()=>{});
        document.removeEventListener('touchstart', unlock);
        document.removeEventListener('click', unlock);
      };
      document.addEventListener('touchstart', unlock, {once:true});
      document.addEventListener('click', unlock, {once:true});
    } else {
      splashPlaySound(ac);
    }
  }catch(e){}
}

playSplashSound();
