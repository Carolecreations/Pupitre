let stage = null, wakeLock = null;
async function keepAwake(on){
  try{
    if(on){ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }
    else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(x){}
}
let metro = null;

function metroBpmFor(s){
  return (s && s.bpm && +s.bpm > 0) ? +s.bpm : 100;
}

function metroInit(){
  if(metro) return metro.ac;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  metro = { ac:new AC(), bpm:100, count:0, playing:false, timer:null };
  return metro.ac;
}

function metroBeep(fort){
  if(!metro || !metro.ac) return;
  const ac = metro.ac;
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = 'square';
  o.frequency.value = fort ? 1400 : 900;
  o.connect(g); g.connect(ac.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(fort ? 0.22 : 0.13, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.start(t);
  o.stop(t + 0.07);
}

function metroTick(){
  if(!metro || !metro.playing) return;
  metroBeep(metro.count % 4 === 0);
  metro.count++;
  metro.timer = setTimeout(metroTick, 60000 / metro.bpm);
}

function metroStart(){
  const ac = metroInit();
  if(!ac){ alert("Audio non disponible sur cet appareil."); return; }
  if(ac.state === 'suspended') ac.resume();
  const s = stage ? song(stage.ids[stage.i]) : null;
  metro.bpm = metroBpmFor(s);
  metro.count = 0;
  metro.playing = true;
  metroTick();
  drawStage(true);
}

function metroStop(){
  if(!metro) return;
  metro.playing = false;
  clearTimeout(metro.timer);
  drawStage(true);
}

function metroToggle(){
  if(!metro || !metro.playing) metroStart();
  else metroStop();
}

function metroBpmChange(d){
  if(!metro) return;
  metro.bpm = Math.max(40, Math.min(240, metro.bpm + d));
  drawStage(true);
}
function openStage(eid){
  const e = event(eid); if(!e) return;
  const ids = (e.setlist||[]).filter(id=>song(id));
  if(!ids.length){ alert('La setlist est vide.'); return; }
  let size = 22;
  try{ size = +localStorage.getItem('pupitre-stage-size') || 22; }catch(x){}
  let speed = 30;
  try{ speed = +localStorage.getItem('pupitre-scroll-speed') || 30; }catch(x){}
  stage = {eid, ids, i:0, size, scroll:{playing:false, speed, timer:null}};
  keepAwake(true);
  drawStage();
}
function closeStage(){
  if(metro && metro.playing){
    metro.playing = false;
    clearTimeout(metro.timer);
  }
  if(stage && stage.scroll){
    stage.scroll.playing = false;
    clearInterval(stage.scroll.timer);
  }
  stage = null; keepAwake(false); drawStage(); }
function stageGo(n){
  if(!stage) return;
  const i = stage.i + n;
  if(i<0 || i>=stage.ids.length) return;
  if(stage.scroll && stage.scroll.playing) scrollStop();
  stage.i = i;
  if(metro && metro.playing){
    metro.bpm = metroBpmFor(song(stage.ids[stage.i]));
  }
  drawStage();
}
function stageSize(d){
  if(!stage) return;
  stage.size = Math.max(14, Math.min(56, stage.size + d));
  try{ localStorage.setItem('pupitre-stage-size', stage.size); }catch(x){}
  drawStage(true);
}
function scrollStart(){
  if(!stage) return;
  const body = document.getElementById('stage-body');
  if(!body) return;
  const maxScroll = body.scrollHeight - body.clientHeight;
  if(maxScroll <= 0){
    alert("Le contenu tient entièrement à l'écran, pas besoin de défiler.\n\nAjoute des paroles ou agrandis la police (A+) pour activer le défilement.");
    return;
  }
  stage.scroll.playing = true;
  clearInterval(stage.scroll.timer);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(!stage || !stage.scroll.playing) return;
    stage.scroll.timer = setInterval(()=>{
      const b = document.getElementById('stage-body');
      if(!b){ scrollStop(); return; }
      const max = b.scrollHeight - b.clientHeight;
      if(max <= 0) return;
      if(b.scrollTop >= max - 1){
        scrollStop();
        return;
      }
      b.scrollTop = Math.min(b.scrollTop + stage.scroll.speed / 20, max);
    }, 50);
  }));
  drawStage(true);
}

function scrollStop(){
  if(!stage) return;
  stage.scroll.playing = false;
  clearInterval(stage.scroll.timer);
  drawStage(true);
}

function scrollToggle(){
  if(!stage) return;
  if(stage.scroll.playing) scrollStop();
  else scrollStart();
}

function scrollChange(d){
  if(!stage) return;
  stage.scroll.speed = Math.max(5, Math.min(120, stage.scroll.speed + d));
  try{ localStorage.setItem('pupitre-scroll-speed', stage.scroll.speed); }catch(x){}
  if(stage.scroll.playing){ scrollStart(); }
  else { drawStage(true); }
}

  function drawStage(keepScroll){
  let el = document.getElementById('stage-root');
  if(!stage){ if(el) el.remove(); return; }
  const s = song(stage.ids[stage.i]);
  if(!s){ closeStage(); return; }

  const top = (keepScroll && prev) ? prev.scrollTop : 0;
  if(!el){
    el = document.createElement('div'); el.id = 'stage-root';
    document.body.appendChild(el);
    let x0 = null, y0 = null;
    el.addEventListener('touchstart', ev=>{ x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; }, {passive:true});
    el.addEventListener('touchend', ev=>{
      if(x0===null) return;
      const dx = ev.changedTouches[0].clientX - x0, dy = ev.changedTouches[0].clientY - y0;
      x0 = null;
      if(Math.abs(dx) > 90 && Math.abs(dy) < 60) stageGo(dx<0 ? 1 : -1);
    }, {passive:true});
  }
  const n = stage.ids.length, z = stage.size;
  const nx = song(stage.ids[stage.i+1]);
  const block = (label, txt, mono) => txt ? `
    <div style="margin-top:${Math.round(z*0.9)}px">
      <div style="font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#8b93a7;margin-bottom:4px">${label}</div>
      <div style="font-size:${mono ? Math.round(z*1.15) : z}px;line-height:1.45;white-space:pre-wrap;${mono?'font-family:ui-monospace,Menlo,Consolas,monospace;color:#a5b4fc;':''}">${esc(txt)}</div>
    </div>` : '';

function toAudioUrl(url){
  if(!url) return '';
  let u = String(url).trim();
  // Google Drive : file/d/ID/view  ou  open?id=ID
  let m = u.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/uc?export=download&id=' + m[1];
  m = u.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/uc?export=download&id=' + m[1];
  // Dropbox : dl=0 → dl=1
  if(/dropbox\.com/.test(u)){
    u = u.replace(/[?&]dl=0/, s=>s.charAt(0)+'dl=1').replace(/[?&]raw=0/, s=>s.charAt(0)+'raw=1');
    if(!/[?&](dl=1|raw=1)/.test(u)) u += (u.includes('?') ? '&raw=1' : '?raw=1');
  }
  return u;
}

let miniPlayer = null;

function fmtTime(t){
  if(!isFinite(t) || t < 0) return '0:00';
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return m + ':' + String(s).padStart(2,'0');
}

async function playAudio(songId, versionId){
  const s = song(songId);
  if(!s) return;
  const v = data.songVersions.find(x => x.id === versionId);
  if(!v) return;
  const url = toAudioUrl(v.url);
  if(!url){ alert('Aucun lien audio pour cette version.'); return; }
  closeMiniPlayer();

  const el = document.createElement('div');
  el.id = 'mini-player';
  el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:250;background:#171a21;border-top:1px solid #2a2f3a;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;box-shadow:0 -4px 12px rgba(0,0,0,.35)';

  const audio = document.createElement('audio');
  audio.preload = 'metadata';
  audio.style.cssText = 'display:none';
  document.body.appendChild(audio);

  const btn = 'background:#1e222b;border:1px solid #2a2f3a;border-radius:8px;padding:8px 12px;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0';
  el.innerHTML = `
    <button data-pp style="${btn};min-width:44px">⏳</button>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
        ${esc(s.title)} <span style="color:#8b93a7;font-weight:400">· ${esc(v.label)}</span>
      </div>
      <input type="range" data-seek min="0" max="1000" value="0" style="width:100%;margin:6px 0 0;padding:0;height:20px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#8b93a7">
        <span data-cur>0:00</span><span data-dur>0:00</span>
      </div>
    </div>
    <button data-close style="${btn}">✕</button>
  `;
  document.body.appendChild(el);
  miniPlayer = {el, audio};

  const pp   = el.querySelector('[data-pp]');
  const seek = el.querySelector('[data-seek]');
  const cur  = el.querySelector('[data-cur]');
  const dur  = el.querySelector('[data-dur]');

  // Téléchargement complet du fichier puis lecture depuis un blob local
  let blobUrl = null;
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    blobUrl = URL.createObjectURL(blob);
    audio.src = blobUrl;
    pp.textContent = '▶';
  }catch(e){
    console.warn('Lecture directe impossible, on tente en streaming :', e.message);
    audio.src = url;
    pp.textContent = '▶';
  }

  pp.onclick = () => {
    if(audio.paused){ audio.play().catch(err=>alert('Lecture impossible : ' + err.message)); }
    else audio.pause();
  };
  audio.onplay  = () => { pp.textContent = '⏸'; };
  audio.onpause = () => { pp.textContent = '▶'; };
  audio.onloadedmetadata = () => { dur.textContent = fmtTime(audio.duration); };
  audio.ontimeupdate = () => {
    cur.textContent = fmtTime(audio.currentTime);
    if(audio.duration && isFinite(audio.duration)){
      seek.value = Math.round(audio.currentTime / audio.duration * 1000);
    }
  };
  audio.onerror = () => { dur.textContent = 'erreur'; };
  seek.oninput = () => {
    if(audio.duration && isFinite(audio.duration)){
      audio.currentTime = seek.value / 1000 * audio.duration;
    }
  };
  el.querySelector('[data-close]').onclick = () => {
    if(blobUrl) URL.revokeObjectURL(blobUrl);
    closeMiniPlayer();
  };

  // Si on a une URL blob, elle est locale, donc play() marche tout de suite
  if(audio.src && audio.src.startsWith('blob:')){
    audio.play().catch(err => console.warn('Lecture auto bloquée :', err.message));
  }
}

function closeMiniPlayer(){
  if(!miniPlayer) return;
  try{ miniPlayer.audio.pause(); }catch(e){}
  if(miniPlayer.blobUrl){
    try{ URL.revokeObjectURL(miniPlayer.blobUrl); }catch(e){}
  }
  try{ miniPlayer.el.remove(); }catch(e){}
  miniPlayer = null;
}
function deleteUser(id){
  const u = user(id); if(!u) return;
  if(id === ui.currentUserId){ alert('Tu ne peux pas supprimer ton propre profil.'); return; }
  const soleAdmin = data.groups.find(g =>
    g.memberships.some(m=>m.userId===id && m.role==='admin') &&
    g.memberships.filter(m=>m.role==='admin').length<=1);
  if(soleAdmin){ alert('« '+u.name+' » est le seul admin de « '+soleAdmin.name+' ». Passe un autre membre admin d\'abord.'); return; }
  if(!confirm('Supprimer définitivement « '+u.name+' » ?\n\nIl sera retiré de tous les groupes et de l\'écran de connexion.')) return;
  data.groups.forEach(g=>{ g.memberships = g.memberships.filter(m=>m.userId!==id); });
  data.tasks.forEach(t=>{ if(Array.isArray(t.assignedTo)) t.assignedTo = t.assignedTo.filter(x=>x!==id); });
  data.events.forEach(e=>{ if(e.availability) delete e.availability[id]; });
  Object.keys(data.privateNotes).forEach(k=>{ if(k.startsWith(id+':')) delete data.privateNotes[k]; });
  data.users = data.users.filter(x=>x.id!==id);
  if(isRoomAdmin() && sync) revokeAccess(id, true);
  save(); render();
}

function addDays(iso,n){
  const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

  openModal({

          <select name="day">${days.map((d,i)=>`<option value="${i}" ${i===4?'selected':''}>${d}</option>`).join('')}</select></div>

      </div>

        <div class="field"><label>Fin</label><input type="time" name="end" value="21:00"></div>

      <p class="sub" style="margin:0">Les dates où une répétition existe déjà ne sont pas dupliquées.</p>`,
    onSubmit: fd=>{
            learnLocation(gid, fd.location);
      const step=+fd.every*7;
      let d=fd.from, created=0, guard=0;
      while(new Date(d+'T00:00:00').getDay()!==+fd.day && guard++<7) d=addDays(d,1);
      guard=0;
      while(d<=fd.to && guard++<60){
        if(!eventsOf(gid).some(e=>e.type==='repetition' && e.date===d)){
          data.events.push({id:uid('e'),groupId:gid,type:'repetition',date:d,
            start:fd.start,end:fd.end,location:fd.location,notes:'',
            checklist:[],availability:{},setlist:[]});
          created++;
        }
        d=addDays(d,step);
      }
      save(); render();
      alert(created+' répétition(s) créée(s).');
    }
  });
}

async function scanAudioOrphans(){
  if(!sync) return {error:"Active la synchro d'abord."};
  const referenced = new Set();
  data.songVersions.forEach(v => {
    if(v.url && /supabase\.co/.test(v.url)){
      const m = v.url.match(/\/object\/public\/audio\/(.+)$/);
      if(m) referenced.add(decodeURIComponent(m[1]));
    }
  });
  let files = [];
  try{
    const r = await fetch(SUPABASE_URL + '/storage/v1/object/list/audio', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ prefix: sync.room + '/', limit: 1000, offset: 0 })
    });
    if(!r.ok) throw new Error('statut ' + r.status);
    files = await r.json();
  }catch(e){
    return {error:"Impossible de lister Supabase : " + (e.message||e)};
  }
  const orphans = [];
  files.forEach(f => {
    const full = sync.room + '/' + f.name;
    if(!referenced.has(full)) orphans.push(full);
  });
  return {orphans, total: files.length, referenced: referenced.size};
}

async function scanImageOrphans(){
  if(!sync) return {error:"Active la synchro d'abord."};
  const referenced = new Set();
  data.events.forEach(e => {
    if(e.tech && e.tech.stageImg) referenced.add(e.tech.stageImg);
  });
  let imgs = {};
  try{
    const r = await fetch(withAuth(syncBase() + '/images.json', await tok()));
    if(!r.ok) throw new Error('statut ' + r.status);
    imgs = (await r.json()) || {};
  }catch(e){
    return {error:"Impossible de lister Firebase : " + (e.message||e)};
  }
  const orphans = [];
  Object.keys(imgs).forEach(id => {
    if(!referenced.has(id)) orphans.push(id);
  });
  return {orphans, total: Object.keys(imgs).length, referenced: referenced.size};
}

async function deleteAudioFile(path){
  try{
    const r = await fetch(SUPABASE_URL + '/storage/v1/object/audio/' + path, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    });
    return r.ok || r.status === 404;
  }catch(e){ return false; }
}

async function deleteImageFile(id){
  try{
    const r = await fetch(withAuth(imgUrl(id), await tok()), {method:'DELETE'});
    return r.ok || r.status === 404;
  }catch(e){ return false; }
}

  document.getElementById('cleanup-body').innerHTML = `
    <p class="small" style="margin:0 0 10px">

    </p>
    <div class="card" style="margin:0 0 12px">
      <div class="small" style="line-height:1.9">
        <strong>🎵 Audio (Supabase)</strong> : ${totalAudio} à supprimer sur ${audio.total}<br>

      </div>
    </div>
    ${totalAudio ? `<details style="margin-bottom:10px"><summary class="small muted" style="cursor:pointer">Voir les fichiers audio</summary>
      <div class="small muted" style="margin-top:8px;font-family:ui-monospace,monospace;font-size:11px;max-height:140px;overflow:auto">${audio.orphans.slice(0,50).map(esc).join('<br>')}${audio.orphans.length>50?'<br>…':''}</div>
    </details>` : ''}
    ${totalImg ? `<details style="margin-bottom:10px"><summary class="small muted" style="cursor:pointer">Voir les images</summary>
      <div class="small muted" style="margin-top:8px;font-family:ui-monospace,monospace;font-size:11px;max-height:100px;overflow:auto">${images.orphans.map(esc).join('<br>')}</div>
    </details>` : ''}
    <p class="small muted" style="margin:0">Aucune donnée active n'est touchée : seuls les fichiers vraiment abandonnés sont supprimés.</p>
    <div class="row" style="margin-top:14px;gap:8px">
      <button class="btn primary" id="cleanup-go">Supprimer ces ${grandTotal} fichier(s)</button>
      <button class="btn ghost" data-close-cleanup>Annuler</button>
    </div>
  `;

  el.querySelectorAll('[data-close-cleanup]').forEach(b => b.onclick = close);

  const go = el.querySelector('#cleanup-go');
  go.onclick = async () => {
    go.disabled = true;
    go.textContent = 'Suppression en cours…';
    let deletedAudio = 0, deletedImg = 0;
    for(const path of audio.orphans){
      if(await deleteAudioFile(path)) deletedAudio++;
    }
    for(const id of images.orphans){
      if(await deleteImageFile(id)) deletedImg++;
    }
    document.getElementById('cleanup-body').innerHTML = `
      <p class="small" style="color:var(--ok);margin:0">✓ Nettoyage terminé.</p>
      <p class="sub" style="margin:8px 0 0">${deletedAudio} audio · ${deletedImg} image(s) supprimé(s).</p>
      <div class="row" style="margin-top:14px"><button class="btn primary" data-close-cleanup>Fermer</button></div>
    `;
    el.querySelectorAll('[data-close-cleanup]').forEach(b => b.onclick = close);
  };
}

const COLOR_CHOICES=['#6366f1','#8b5cf6','#ec4899','#ef4444','#f97316','#f59e0b','#eab308','#10b981','#14b8a6','#06b6d4','#3b82f6','#94a3b8'];
function hexToHsl(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0, s=0; const l=(mx+mn)/2;
  if(d){
    s = d/(1-Math.abs(2*l-1));
    if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  return {h:Math.round(h)%360, s:Math.round(s*100), l:Math.round(l*100)};
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const x=v=>Math.round(v*255).toString(16).padStart(2,'0');
  return '#'+x(f(0))+x(f(8))+x(f(4));
}
function cpGrad(k,h,s,l){
  if(k==='h'){
    const st=[]; for(let i=0;i<=12;i++) st.push('hsl('+(i*30)+','+s+'%,'+l+'%)');
    return 'linear-gradient(to right,'+st.join(',')+')';
  }
  if(k==='s') return 'linear-gradient(to right,hsl('+h+',0%,'+l+'%),hsl('+h+',100%,'+l+'%))';
  return 'linear-gradient(to right,hsl('+h+','+s+'%,15%),hsl('+h+','+s+'%,50%),hsl('+h+','+s+'%,85%))';
}
function colorField(cur){
  let c=String(cur||'').toLowerCase(); if(!/^#[0-9a-f]{6}$/.test(c)) c='#6366f1';
  const o=hexToHsl(c), L=Math.min(85,Math.max(15,o.l));
  const sl=(k,min,max,val,lab)=>`<div class="cp-l">${lab}</div><input type="range" class="cs" data-k="${k}" min="${min}" max="${max}" value="${val}" style="background:${cpGrad(k,o.h,o.s,L)}">`;
  return `<div data-cp>
    <div class="sw-row">${COLOR_CHOICES.map(x=>`<button type="button" class="sw${x===c?' sel':''}" data-sw="${x}" style="background:${x}" aria-label="Couleur ${x}"></button>`).join('')}</div>
    <div class="cp-prev" data-pv style="background:${c}"><span>${c.toUpperCase()}</span></div>
    ${sl('h',0,360,o.h,'Teinte (du rouge au violet)')}
    ${sl('s',0,100,o.s,'Intensité')}
    ${sl('l',15,85,L,'Clarté')}
    <input type="hidden" name="color" value="${c}">
  </div>`;
}
function cpApply(box,h,s,l,syncSliders,hexOverride){
  const hex = hexOverride || hslToHex(h,s,l);
  box.querySelector('input[name=color]').value = hex;
  const pv = box.querySelector('[data-pv]'); pv.style.background = hex; pv.firstElementChild.textContent = hex.toUpperCase();
  const vals = {h:h, s:s, l:Math.min(85,Math.max(15,l))};
  ['h','s','l'].forEach(k=>{
    const r = box.querySelector('.cs[data-k='+k+']');
    if(syncSliders) r.value = vals[k];
    r.style.background = cpGrad(k, vals.h, vals.s, vals.l);
  });
  box.querySelectorAll('.sw').forEach(x=>x.classList.toggle('sel', x.dataset.sw===hex));
}

function icsEsc(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
}
function icsFold(line){
  const out = []; let l = line;
  while(l.length>60){ out.push(l.slice(0,60)); l = ' '+l.slice(60); }
  out.push(l);
  return out.join('\r\n');
}
function icsStamp(iso, min){
  let d = iso;
  while(min>=1440){ d = addDays(d,1); min -= 1440; }
  return d.replace(/-/g,'')+'T'+String(Math.floor(min/60)).padStart(2,'0')+String(min%60).padStart(2,'0')+'00';
}
function icsBuild(list){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pupitre//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Pupitre'];
  list.forEach(e=>{
    const g = group(e.groupId); if(!g) return;
    const t = typeOf(e.type);
    const s = toMin(e.start);
    L.push('BEGIN:VEVENT','UID:'+e.id+'@pupitre','DTSTAMP:'+stamp);
    if(s===null){
      L.push('DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''), 'DTEND;VALUE=DATE:'+addDays(e.date,1).replace(/-/g,''));
    } else {
      let en = toMin(e.end);
      if(en===null) en = s+120; else if(en<=s) en += 1440;
      L.push('DTSTART:'+icsStamp(e.date,s), 'DTEND:'+icsStamp(e.date,en));
    }
    L.push(icsFold('SUMMARY:'+icsEsc(g.name+' — '+t.label)));
    if(e.location) L.push(icsFold('LOCATION:'+icsEsc(e.location)));
    const desc = [];
    if(e.notes) desc.push(e.notes);
    const sl = (e.setlist||[]).map(id=>song(id)).filter(Boolean).map(x=>x.title);
    if(sl.length) desc.push((e.type==='repetition' ? 'À travailler : ' : 'Setlist : ')+sl.join(', '));
        if(desc.length) L.push(icsFold('DESCRIPTION:'+icsEsc(desc.join('\n'))));
    /* Rappels : la veille + 2h avant (uniquement si l'événement a une heure) */
    if(s!==null){
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(g.name+' — '+t.label+' demain'),'TRIGGER:-P1D','END:VALARM');
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(g.name+' — '+t.label+' dans 2 heures'),'TRIGGER:-PT2H','END:VALARM');
    } else {
      /* Événement "journée entière" : un seul rappel la veille */
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(g.name+' — '+t.label+' demain'),'TRIGGER:-P1D','END:VALARM');
    }
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}
  function downloadIcs(){
  const ics = window._pupIcs || '';
  if(!ics){ alert("Rien à exporter."); return; }
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pupitre-agenda.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

function shareIcs(){
  const ics = window._pupIcs || '';
  const file = new File([ics], 'pupitre-agenda.ics', {type:'text/calendar'});
  if(!navigator.share || !(navigator.canShare && navigator.canShare({files:[file]}))){
    alert("Partage indisponible ici. Utilise le lien « Ouvrir dans l'agenda »."); return;
  }
  navigator.share({files:[file]}).catch(e=>{
    if(e && e.name!=='AbortError') alert('Partage impossible : '+(e.message||e));
  });
}

async function changeMyCode(){
  const u = fbAuth && fbAuth.currentUser;
  if(!sync || !u) throw new Error('tu dois être connecté et la synchro active');
  const room = encodeURIComponent(sync.room);
  const r0 = await dbCall('GET', 'members/' + room + '/' + u.uid);
  const mem = r0.ok ? await r0.json() : null;
  if(!mem || !mem.userId) throw new Error('accès introuvable sur cet appareil');
  const code = genCode();
  const body = {room: sync.room, userId: mem.userId, exp: Date.now() + INVITE_DAYS*86400000, created: Date.now()};
  if(mem.admin) body.admin = true;
  const r = await dbCall('PUT', 'invites/' + code, body);
  if(!r.ok) throw new Error('statut ' + r.status);
  // l'ancien code est supprimé : il ne fonctionne plus
  const old = normCode(mem.code);
  if(old && old !== code){ try{ await dbCall('DELETE', 'invites/' + old); }catch(e){} }
  try{ await dbCall('PATCH', 'members/' + room + '/' + u.uid, {code}); }catch(e){}
  return code;
}
async function runChangeMyCode(){
  let code;
  try{ code = await changeMyCode(); }
  catch(e){
    const m = String((e && e.message) || e);
    alert((/40[13]/.test(m) ? "Le serveur a refusé le changement de code (règles Firebase)." : "Impossible de changer le code (" + m + ").") + " Ton code actuel reste valable.");

  let svg = null;
  try{ svg = qrSvg(inviteLink(code)); }catch(e){}

function qrSvg(text){
  if(typeof qrcode==='undefined') return null;
  const qr = qrcode(0,'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), m = 4, size = n+2*m;
  let d = '';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) d += 'M'+(c+m)+' '+(r+m)+'h1v1h-1z';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" style="width:100%;max-width:340px;background:#fff;border-radius:8px"><path d="${d}" fill="#000"/></svg>`;
}

/* ============ SON DU SPLASH (synthé électro) ============ */
function splashPlaySound(ac){
  const t0 = ac.currentTime + 0.02;

  const master = ac.createGain();
  master.gain.value = 0.34;
  master.connect(ac.destination);

  // Bus de réverbe court, filtré pour éviter les aigus cristallins
  const rev = ac.createConvolver();
  const len = ac.sampleRate * 1.4;
  const ir = ac.createBuffer(2, len, ac.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = ir.getChannelData(ch);
    for(let i=0; i<len; i++){
      d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3.2);
    }
  }
  rev.buffer = ir;

  const revFilt = ac.createBiquadFilter();
  revFilt.type = 'lowpass';
  revFilt.frequency.value = 1400;
  revFilt.Q.value = 0.7;

  const revGain = ac.createGain();
  revGain.gain.value = 0.18;
  rev.connect(revFilt);
  revFilt.connect(revGain);
  revGain.connect(master);

  /* 1. NAPPE SAW DÉTUNÉE (0 → 2s) */
  {
    const freqs = [110, 165, 220];
    const filt = ac.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(320, t0);
    filt.frequency.exponentialRampToValueAtTime(2200, t0 + 1.9);
    filt.Q.value = 9;

    freqs.forEach((f, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sawtooth';
      o.frequency.value = f * (1 + (i - 1) * 0.006);
      o.connect(g); g.connect(filt);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.045, t0 + 0.8);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.15);
      o.start(t0); o.stop(t0 + 2.2);
    });

    filt.connect(master);
    filt.connect(rev);
  }

  /* 2. RISER SAW RÉSONANT (0.4 → 2s) */
  {
    const o = ac.createOscillator();
    const g = ac.createGain();
    const filt = ac.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(180, t0 + 0.4);
    o.frequency.exponentialRampToValueAtTime(580, t0 + 2.0);
    filt.type = 'bandpass';
    filt.frequency.setValueAtTime(500, t0 + 0.4);
    filt.frequency.exponentialRampToValueAtTime(3200, t0 + 2.0);
    filt.Q.value = 14;
    o.connect(filt); filt.connect(g); g.connect(master);

    g.gain.setValueAtTime(0.0001, t0 + 0.4);
    g.gain.exponentialRampToValueAtTime(0.075, t0 + 1.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.05);
    o.start(t0 + 0.4); o.stop(t0 + 2.1);
  }

  /* 3. SUB BASS (0 → 2.1s) */
  {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(55, t0);
    o.frequency.exponentialRampToValueAtTime(82, t0 + 1.9);
    o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.20, t0 + 1.0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.15);
    o.start(t0); o.stop(t0 + 2.2);
  }

  /* 4. EXPLOSION SYNTH (2.0s) — kick + stab d'accord */
  {
    const tb = t0 + 2.0;

    // Kick synthé : sinus 130 → 42 Hz
    {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(130, tb);
      o.frequency.exponentialRampToValueAtTime(42, tb + 0.22);
      o.connect(g); g.connect(master);
      g.gain.setValueAtTime(0.0001, tb);
      g.gain.exponentialRampToValueAtTime(0.55, tb + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, tb + 0.35);
      o.start(tb); o.stop(tb + 0.4);
    }

    // Stab d'accord : 4 voix triangle douces, filtre qui se referme
    const notes = [261.63, 392.00, 523.25, 783.99];
    const filt = ac.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(2400, tb);
    filt.frequency.exponentialRampToValueAtTime(700, tb + 1.5);
    filt.Q.value = 2.5;
    filt.connect(master);
    filt.connect(rev);

    notes.forEach((f, i) => {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      o.connect(g); g.connect(filt);
      const t = tb + i * 0.015;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.10, t + 0.045);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
      o.start(t); o.stop(t + 1.8);
    });
  }
}

function playSplashSound(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ac = new AC();
    if(ac.state === 'suspended'){
      const unlock = () => {
        ac.resume().then(()=>splashPlaySound(ac)).catch(()=>{});
        document.removeEventListener('touchstart', unlock);
        document.removeEventListener('click', unlock);
      };
      document.addEventListener('touchstart', unlock, {once:true});
      document.addEventListener('click', unlock, {once:true});
    } else {
      splashPlaySound(ac);
    }
  }catch(e){}
}
